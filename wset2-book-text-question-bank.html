.wrap{max-width:640px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}

.back{color:var(--accent);text-decoration:none;font-size:.9rem;align-self:flex-start}

.track{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.fill{height:100%;background:var(--accent);width:0;transition:width .25s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.tag{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.q{font-family:var(--display);font-size:1.3rem;line-height:1.3;margin:0;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:12px 14px;font:400 1rem var(--body);cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:focus-visible,.chip:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt .k{font-weight:600;color:var(--muted);min-width:1.1em}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.right .k{color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{color:var(--bad)}
.opt.dim{opacity:.5}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.verdict{font-weight:600;font-size:.95rem}
.verdict.g{color:var(--good)} .verdict.b{color:var(--bad)}
.btn{border:none;background:var(--accent);color:var(--surface);border-radius:10px;padding:11px 18px;font:600 .95rem var(--body);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.end{text-align:center;gap:10px;align-items:center}
.status{font-size:.8rem;color:var(--muted);margin:4px 0 0}
.chip.miss{border-color:var(--star);color:var(--star)}
.chip.miss[aria-pressed="true"]{background:var(--star);border-color:var(--star);color:var(--surface)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.star{border:none;background:transparent;color:var(--muted);font-size:1.5rem;line-height:1;padding:4px 6px;cursor:pointer;border-radius:8px}

.big{font-family:var(--display);font-size:3rem;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
@media (prefers-reduced-motion: reduce){.fill{transition:none}}

// Starred ("Remember") questions: one doc per question in "starred"; deleted when unstarred
function key(q){let h=0;for(const c of q[1])h=(h*31+c.charCodeAt(0))|0;return "q"+(h>>>0).toString(36)}
const byKey={}; Q.forEach(q=>byKey[key(q)]=q);
let stars={}, store=null, mode="none", writing=Promise.resolve();
function setStatus(t){$("status").textContent=t}
function starDeck(){return Object.keys(stars).filter(k=>byKey[k]).map(k=>byKey[k])}
function loadLocal(){try{stars=JSON.parse(localStorage.getItem("wset2-starred")||"{}")}catch(e){stars={}}}
function saveLocal(){try{localStorage.setItem("wset2-starred",JSON.stringify(stars))}catch(e){}}
function refreshStar(){const s=$("star"); if(!s||!deck[i]) return; const on=!!stars[key(deck[i])]; s.setAttribute("aria-pressed",String(on)); s.textContent=on?"★":"☆"; s.title=on?"Remove from Remember":"Remember this question"}
async function initStore(){
  let db=null; try{db=await claude.use("db")}catch(e){}
  if(!db){mode="local";loadLocal();setStatus("Starred questions are saved in this browser.");chips();refreshStar();return}
  store=db.collection("starred"); mode="db";
  let t=setTimeout(()=>setStatus("Can't reach starred questions yet."),10000);
  store.onSnapshot(snap=>{
    const m={}; snap.docs.forEach(d=>{if(d.exists)m[d.id]=d.data()}); stars=m;
    if(!snap.metadata.fromCache){clearTimeout(t);setStatus("Starred questions are saved to your account.")}
    chips(); refreshStar();
  },e=>{clearTimeout(t);mode="local";loadLocal();setStatus("Saving stars in this browser only.");chips();refreshStar()});
}
function toggleStar(q){
  const k=key(q), on=!stars[k];
  if(on) stars[k]={ch:q[0],q:q[1],answer:q[2],starredAt:new Date().toISOString()}; else delete stars[k];
  chips(); refreshStar();
  if(mode==="db"){const doc=stars[k]; writing=writing.then(()=>on?store.doc(k).set(doc):store.doc(k).delete()).catch(()=>setStatus("Couldn't save that star. Check your connection."))}
  else saveLocal();
}
function shuffle(a){a=a.slice();for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}

  const c=$("chips"); c.innerHTML="";
  const n=starDeck().length, NCH=Object.keys(CH).length;
  [["all",(chap==="sel"&&sel.size===NCH)?"None":"All"],...Object.keys(CH).map(k=>[k,"Ch "+k]),["starred","★ Remember ("+n+")"]].forEach(([v,l])=>{
    const b=document.createElement("button"); b.className="chip"+(v==="starred"?" miss":""); b.id="chip-"+v; b.textContent=l;
    if(v==="starred"&&!n&&chap!=="starred") b.disabled=true;
    const on=v==="starred"?chap==="starred":v==="all"?false:(chap==="sel"&&sel.has(v));
    b.setAttribute("aria-pressed",String(on)); b.title=v==="all"?(l==="None"?"Clear all chapters":"Select all chapters"):v==="starred"?"Questions you starred":CH[v];
    b.onclick=()=>{
      if(v==="starred"){chap="starred";sel.clear()}
      else if(v==="all"){const full=chap==="sel"&&sel.size===NCH; chap="sel"; sel=full?new Set():new Set(Object.keys(CH))}
      else{if(chap!=="sel"){chap="sel";sel.clear()} sel.has(v)?sel.delete(v):sel.add(v)}
      start()}; c.appendChild(b);
  });
}
function start(list){
  deck = shuffle(list || (chap==="starred"?starDeck():Q.filter(q=>sel.has(String(q[0])))));
  i=0; right=0; answered=0; missed=[]; chips(); show();
}
function stats(){
  $("pos").textContent=`Question ${Math.min(i+1,deck.length)} of ${deck.length}`;
  $("score").textContent=`${right}/${answered} (${answered?Math.round(right/answered*100):0}%)`;
  $("fill").style.width=(deck.length?answered/deck.length*100:0)+"%";
}
function show(){
  stats();
  const card=$("card");
  if(!deck.length){card.className="card end";card.innerHTML=chap==="starred"?`<div class="tag">Nothing starred</div><p class="sub">Tap ☆ on any question to remember it.</p>`:`<div class="tag">No chapters selected</div><p class="sub">Tap one or more chapters, or All.</p>`;return}
  if(i>=deck.length){return end()}
  const q=deck[i]; const opts=shuffle(q.slice(2).map((t,n)=>({t,ok:n===0})));
  card.className="card";
  card.innerHTML=`<div class="top"><div class="tag">Chapter ${q[0]} · ${CH[q[0]]}</div><button class="star" id="star" aria-pressed="false" aria-label="Remember">☆</button></div><p class="q"></p><div class="opts"></div><div class="foot"><span class="verdict" aria-live="polite"></span><button class="btn" id="next" hidden>Next</button></div>`;
  card.querySelector(".q").textContent=q[1];
  $("star").onclick=()=>toggleStar(q); refreshStar();
  const box=card.querySelector(".opts");
  opts.forEach((o,n)=>{
    const b=document.createElement("button"); b.className="opt"; b.id="opt-"+n;
    b.innerHTML=`<span class="k">${"ABCD"[n]}</span><span></span>`; b.lastChild.textContent=o.t;
    b.onclick=()=>pick(b,o,opts,box,q); box.appendChild(b);
  });
}
function pick(b,o,opts,box,q){
  answered++; if(o.ok) right++; else missed.push(q);
  [...box.children].forEach((el,n)=>{
    el.disabled=true;
    if(opts[n].ok) el.classList.add("right");
    else if(el===b) el.classList.add("wrong");
    else el.classList.add("dim");
  });
  const v=$("card").querySelector(".verdict");
  v.textContent=o.ok?"Correct":"Incorrect"; v.className="verdict "+(o.ok?"g":"b");
  const nx=$("next"); nx.hidden=false; nx.textContent=i===deck.length-1?"See results":"Next";
  nx.onclick=()=>{i++;show()}; nx.focus({preventScroll:true});
  stats();
}
function end(){
  const pct=deck.length?Math.round(right/deck.length*100):0;
  const card=$("card"); card.className="card end";
  card.innerHTML=`<div class="tag">Done</div><p class="big">${right}/${deck.length}</p><p class="sub">${pct}% correct</p><div class="row"></div>`;
  const row=card.querySelector(".row");
  if(missed.length){const m=document.createElement("button");m.className="btn";m.id="redo-missed";m.textContent=`Retry ${missed.length} missed`;const list=missed.slice();m.onclick=()=>start(list);row.appendChild(m)}
  const r=document.createElement("button");r.className="btn ghost";r.id="restart";r.textContent="Start over";r.onclick=()=>start();row.appendChild(r);
}
start();
initStore();
</script>
</body>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Select Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: same look as the Region Test; options toggle on and off, Submit checks them, then turns into Next */
:root{
  --bg:#f3f2f5; --surface:#ffffff; --fg:#1d1a22; --muted:#6b6573; --line:#dcd8e1;
  --accent:#7a1f3d; --accent-soft:#f1e3e8;
  --star:#b7791f; --good:#1f7a45; --good-bg:#e2f3e8; --bad:#b3261e; --bad-bg:#fbe4e2;
  --display:"Gloock", Georgia, "Times New Roman", serif;
  --body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141218; --surface:#1e1b23; --fg:#ece8f0; --muted:#a39dab; --line:#34303b;
  --accent:#e08aa6; --accent-soft:#3a2230;
  --star:#f2c14e; --good:#5fd08a; --good-bg:#16301f; --bad:#ff8a80; --bad-bg:#3a1a18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141218; --surface:#1e1b23; --fg:#ece8f0; --muted:#a39dab; --line:#34303b;
  --accent:#e08aa6; --accent-soft:#3a2230;
  --star:#f2c14e; --good:#5fd08a; --good-bg:#16301f; --bad:#ff8a80; --bad-bg:#3a1a18; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-weight:400;font-size:1.9rem;margin:0;text-wrap:balance}
.back{color:var(--accent);text-decoration:none;font-size:.9rem;align-self:flex-start}
.sub{color:var(--muted);margin:2px 0 0;font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;font:500 .85rem var(--body);cursor:pointer;text-decoration:none}
.chip:disabled{opacity:.45;cursor:default}
.chip[aria-pressed="true"],.chip[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.chip.miss{border-color:var(--star);color:var(--star)}
.chip.miss[aria-pressed="true"]{background:var(--star);border-color:var(--star);color:var(--surface)}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar b{color:var(--fg)}
.track{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.fill{height:100%;background:var(--accent);width:0;transition:width .25s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.q{font-family:var(--display);font-size:1.3rem;line-height:1.3;margin:0;text-wrap:pretty}
.hint{color:var(--muted);font-size:.85rem;margin:-8px 0 0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:12px 14px;font:400 1rem var(--body);cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:focus-visible,.chip:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt .k{font-weight:600;color:var(--muted);min-width:1.1em}
.opt .tick{margin-left:auto;font-weight:600}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .k{color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.right .k,.opt.right .tick{color:var(--good)}
.opt.missed{border-color:var(--good);border-style:dashed;background:var(--surface)}
.opt.missed .k,.opt.missed .tick{color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k,.opt.wrong .tick{color:var(--bad)}
.opt.dim{opacity:.5}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.verdict{font-weight:600;font-size:.95rem}
.verdict.g{color:var(--good)} .verdict.b{color:var(--bad)}
.xnote{color:var(--muted);font-size:.9rem;margin:0}
.btn{border:none;background:var(--accent);color:var(--surface);border-radius:10px;padding:11px 18px;font:600 .95rem var(--body);cursor:pointer;margin-left:auto}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent);margin-left:0}
.end{text-align:center;gap:10px;align-items:center}
.end .btn{margin-left:0}
.status{font-size:.8rem;color:var(--muted);margin:4px 0 0}
.star{border:none;background:transparent;color:var(--muted);font-size:1.5rem;line-height:1;padding:4px 6px;cursor:pointer;border-radius:8px}
.star[aria-pressed="true"]{color:var(--star)}
.star:hover{color:var(--star)}
.star:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.big{font-family:var(--display);font-size:3rem;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
@media (prefers-reduced-motion: reduce){.fill{transition:none}}
</style>
</head>

];

// Mode from the address: ?by=region shows a region and asks for its grapes; otherwise a grape and asks for its regions
const BY=new URLSearchParams(location.search).get("by")==="region"?"region":"variety";
const M={
  variety:{Q:QV,title:"Given Variety",tag:"Variety",ask:(n,c)=>`Which regions${c?" in "+c:""} is ${n} noted for?`,
    intro:"A grape is shown; select every region it is noted for. 1–4 of the 4 options are right."},
  region:{Q:QR,title:"Given Region",tag:"Region",ask:n=>`Which grapes is ${n} noted for?`,
    intro:"A region is shown; select every grape it is noted for. 1–4 of the 4 options are right."},
}[BY];
const Q=M.Q;
document.title=M.title; document.getElementById("title").textContent=M.title; document.getElementById("intro").textContent=M.intro;

const $=id=>document.getElementById(id);
let chap="all", deck=[], i=0, right=0, answered=0, missed=[];
// Starred ("Remember") questions, saved per mode
const STORE="wset2-select-"+BY+"-starred";
function key(q){let h=0;for(const c of BY+"|"+q.q)h=(h*31+c.charCodeAt(0))|0;return "q"+(h>>>0).toString(36)}
const byKey={}; Q.forEach(q=>byKey[key(q)]=q);
let stars={}, store=null, mode="none", writing=Promise.resolve();
function setStatus(t){$("status").textContent=t}
// Questions for one country: Given Region filters by the region's country; Given Variety uses the country version
function ctryDeck(ct){return BY==="region"?Q.filter(q=>q.c===ct):Q.filter(q=>q.k[ct]).map(q=>({...q,...q.k[ct],ct}))}
function starDeck(){return Object.keys(stars).filter(k=>byKey[k]).map(k=>byKey[k])}
function loadLocal(){try{stars=JSON.parse(localStorage.getItem(STORE)||"{}")}catch(e){stars={}}}
function saveLocal(){try{localStorage.setItem(STORE,JSON.stringify(stars))}catch(e){}}
function refreshStar(){const s=$("star"); if(!s||!deck[i]) return; const on=!!stars[key(deck[i])]; s.setAttribute("aria-pressed",String(on)); s.textContent=on?"★":"☆"; s.title=on?"Remove from Remember":"Remember this question"}
async function initStore(){
  let db=null; try{db=await claude.use("db")}catch(e){}
  if(!db){mode="local";loadLocal();setStatus("Starred questions are saved in this browser.");chips();refreshStar();return}
  store=db.collection(STORE); mode="db";
  let t=setTimeout(()=>setStatus("Can't reach starred questions yet."),10000);
  store.onSnapshot(snap=>{
    const m={}; snap.docs.forEach(d=>{if(d.exists)m[d.id]=d.data()}); stars=m;
    if(!snap.metadata.fromCache){clearTimeout(t);setStatus("Starred questions are saved to your account.")}
    chips(); refreshStar();
  },e=>{clearTimeout(t);mode="local";loadLocal();setStatus("Saving stars in this browser only.");chips();refreshStar()});
}
function toggleStar(q){
  const k=key(q), on=!stars[k];
  if(on) stars[k]={q:q.q,answer:q.a.join(" / "),starredAt:new Date().toISOString()}; else delete stars[k];
  chips(); refreshStar();
  if(mode==="db"){const doc=stars[k]; writing=writing.then(()=>on?store.doc(k).set(doc):store.doc(k).delete()).catch(()=>setStatus("Couldn't save that star. Check your connection."))}
  else saveLocal();
}
function shuffle(a){a=a.slice();for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
// More than 4 right answers: split into ceil(n/4) parts with a random share of them each, so every answer is asked
function parts(list){
  return list.flatMap(q=>{
    const n=Math.ceil(q.a.length/4); if(n<2) return [{...q,p:q.a}];
    const a=shuffle(q.a), out=Array.from({length:n},()=>[]);
    a.forEach((x,j)=>out[j%n].push(x));
    return out.map((p,j)=>({...q,p,part:`${j+1} of ${n}`}));
  });
}
const partCount=list=>list.reduce((s,q)=>s+Math.max(1,Math.ceil(q.a.length/4)),0);
// This part's right answers, then wrong ones to make four: near first, then far (never another right answer)
function build(q){
  const ok=q.p, w=[];
  for(const x of [...shuffle(q.n),...shuffle(q.f)]){if(ok.length+w.length>=4)break; if(!w.includes(x)&&!q.a.includes(x))w.push(x)}
  return shuffle([...ok.map(t=>({t,ok:true})),...w.map(t=>({t,ok:false}))]);
}

function chips(){
  const c=$("chips"); c.innerHTML="";
  const n=starDeck().length;
  // All, one chip per country, then Remember
  [["all","All ("+partCount(Q)+")"],...CTRY.filter(ct=>ctryDeck(ct).length).map(ct=>[ct,ct+" ("+partCount(ctryDeck(ct))+")"]),["starred","★ Remember ("+n+")"]].forEach(([v,l])=>{
    const b=document.createElement("button"); b.className="chip"+(v==="starred"?" miss":""); b.id="chip-"+v; b.textContent=l;
    if(v==="starred"&&!n&&chap!=="starred") b.disabled=true;
    b.setAttribute("aria-pressed",String(chap===v));
    b.onclick=()=>{chap=v; start()}; c.appendChild(b);
  });
}
function start(list){
  deck=shuffle(list||parts(chap==="starred"?starDeck():chap==="all"?Q:ctryDeck(chap)));
  i=0; right=0; answered=0; missed=[]; chips(); show();
}
function stats(){
  $("pos").textContent=`Question ${Math.min(i+1,deck.length)} of ${deck.length}`;
  $("score").textContent=`${right}/${answered} (${answered?Math.round(right/answered*100):0}%)`;
  $("fill").style.width=(deck.length?answered/deck.length*100:0)+"%";
}
function show(){
  stats();
  const card=$("card");
  if(!deck.length){card.className="card end";card.innerHTML=`<div class="tag">Nothing starred</div><p class="sub">Tap ☆ on any question to remember it.</p>`;return}
  if(i>=deck.length) return end();
  const q=deck[i], opts=build(q);
  card.className="card";
  card.innerHTML=`<div class="top"><div class="tag"></div><button class="star" id="star" aria-pressed="false" aria-label="Remember">☆</button></div><p class="q"></p><p class="hint">Select all that apply.</p><div class="opts"></div><p class="xnote" hidden></p><div class="foot"><span class="verdict" aria-live="polite"></span><button class="btn" id="next" disabled>Submit</button></div>`;
  card.querySelector(".tag").textContent=M.tag;
  card.querySelector(".q").textContent=M.ask(q.q,q.ct)+(q.part?` (part ${q.part})`:"");
  $("star").onclick=()=>toggleStar(q); refreshStar();
  const box=card.querySelector(".opts"), nx=$("next");
  const sync=()=>{nx.disabled=![...box.children].some(b=>b.getAttribute("aria-pressed")==="true")};
  opts.forEach((o,n)=>{
    const b=document.createElement("button"); b.className="opt"; b.id="opt-"+n; b.setAttribute("aria-pressed","false");
    b.innerHTML=`<span class="k">${"ABCD"[n]}</span><span></span><span class="tick"></span>`; b.children[1].textContent=o.t;
    b.onclick=()=>{b.setAttribute("aria-pressed",String(b.getAttribute("aria-pressed")!=="true")); sync()};
    box.appendChild(b);
  });
  nx.onclick=()=>submit(opts,box,q);
}
// Right only if exactly the correct options are selected
function submit(opts,box,q){
  const picked=[...box.children].map(b=>b.getAttribute("aria-pressed")==="true");
  const ok=opts.every((o,n)=>o.ok===picked[n]);
  answered++; if(ok) right++; else missed.push(q);
  [...box.children].forEach((el,n)=>{
    el.disabled=true; const o=opts[n], p=picked[n], t=el.querySelector(".tick");
    if(o.ok&&p){el.classList.add("right"); t.textContent="✓"}
    else if(o.ok){el.classList.add("missed"); t.textContent="missed"}
    else if(p){el.classList.add("wrong"); t.textContent="✗"}
    else el.classList.add("dim");
  });
  const v=$("card").querySelector(".verdict");
  v.textContent=ok?"Correct":"Incorrect"; v.className="verdict "+(ok?"g":"b");
  const x=$("card").querySelector(".xnote"); x.textContent=q.x; x.hidden=false;
  const nx=$("next"); nx.textContent=i===deck.length-1?"See results":"Next";
  nx.onclick=()=>{i++;show()}; nx.focus({preventScroll:true});
  stats();
}
function end(){
  const pct=deck.length?Math.round(right/deck.length*100):0;
  const card=$("card"); card.className="card end";
  card.innerHTML=`<div class="tag">Done</div><p class="big">${right}/${deck.length}</p><p class="sub">${pct}% correct</p><div class="row"></div>`;
  const row=card.querySelector(".row");
  if(missed.length){const m=document.createElement("button");m.className="btn";m.id="redo-missed";m.textContent=`Retry ${missed.length} missed`;const list=missed.slice();m.onclick=()=>start(list);row.appendChild(m)}
  const r=document.createElement("button");r.className="btn ghost";r.id="restart";r.textContent="Start over";r.onclick=()=>start();row.appendChild(r);
}
start();
initStore();
</script>

<style>
/* Layout: single-column phone card stack, sticky progress header, sticky action bar at the bottom */
:root{
  --bg:#f5f2f5; --surface:#ffffff; --ink:#231a25; --muted:#6d6371; --line:#e4dde6;
  --accent:#7b1e3e; --accent-ink:#ffffff; --accent-soft:#f3e4ea;
  --good:#1d7449; --good-bg:#e4f2ea; --bad:#b0222c; --bad-bg:#fbe8ea;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141015; --surface:#1e1920; --ink:#efe8f1; --muted:#a79cab; --line:#342b37;
  --accent:#d9668e; --accent-ink:#1a0e13; --accent-soft:#33202a;
  --good:#62c996; --good-bg:#15281e; --bad:#f17c83; --bad-bg:#2f171a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141015; --surface:#1e1920; --ink:#efe8f1; --muted:#a79cab; --line:#342b37;
  --accent:#d9668e; --accent-ink:#1a0e13; --accent-soft:#33202a;
  --good:#62c996; --good-bg:#15281e; --bad:#f17c83; --bad-bg:#2f171a; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px}
h1{font-family:var(--display);font-weight:400;font-size:2rem;line-height:1.15;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:600;background:var(--accent);color:var(--accent-ink);width:100%;font-size:1rem}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.stats{display:flex;gap:18px;margin:18px 0 6px;font-variant-numeric:tabular-nums}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:1.6rem}
.stat span{color:var(--muted);font-size:.82rem}
.sec{margin-top:26px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0}
.chips{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.chip{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.chip .box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--muted);flex:none;display:grid;place-items:center;font-size:.8rem;color:var(--accent-ink)}
.chip[aria-pressed="true"]{border-color:var(--accent)}
.chip[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.chip .nm{flex:1;min-width:0}
.chip .ct{color:var(--muted);font-size:.82rem;font-variant-numeric:tabular-nums}
.toggle{display:flex;align-items:center;justify-content:space-between;margin-top:18px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.sw{width:46px;height:28px;border-radius:99px;background:var(--line);border:0;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(18px)}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dock .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
/* study */
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding-block:10px;display:flex;align-items:center;gap:12px}
.back{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;flex:none;font-size:1.1rem}
.prog{flex:1;min-width:0}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.meta{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-top:5px;font-variant-numeric:tabular-nums}
.card{margin-top:14px}
.tags{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--bad-bg);color:var(--bad)}
.q{font-family:var(--display);font-weight:400;font-size:1.32rem;line-height:1.3;margin:10px 0 0;text-wrap:balance}
.stmts{margin:10px 0 0;padding-left:20px;color:var(--ink)}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 14px;min-height:52px}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;background:var(--accent-soft);color:var(--accent)}
.opt .t{flex:1;min-width:0;padding-top:1px}
.opt:not(:disabled):active{transform:scale(.99)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.right .l{background:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .l{background:var(--bad);color:var(--surface)}
.opt.dim{opacity:.85}
.why{display:block;font-size:.86rem;color:var(--muted);margin-top:4px;line-height:1.4}
.opt.right .why{color:var(--good);font-weight:600}
.opt.wrong .why{color:var(--bad)}
.fb{margin-top:16px;border-radius:12px;padding:14px 16px;border:1px solid var(--line);background:var(--surface)}
.fb h3{margin:0 0 6px;font-size:1rem}
.fb.ok h3{color:var(--good)}
.fb.no h3{color:var(--bad)}
.fb p{margin:0}
.fb .ans{margin:0 0 8px;font-weight:600}
.fb .mem{margin-top:12px;background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.fb .mem .lb{display:block;font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--accent);margin-bottom:2px}
.fb .later{margin-top:10px;font-size:.85rem;color:var(--muted)}
.miss{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.mi{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.mi .n{font-size:.78rem;color:var(--muted)}
.mi .a{color:var(--good);font-weight:600;font-size:.9rem;margin-top:4px}
.kbd{display:none;color:var(--muted);font-size:.78rem;margin-top:14px}
@media (hover:hover) and (pointer:fine){.kbd{display:block}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const CH={1:"Tasting & evaluating",2:"Food & wine pairing",3:"Storage & service",4:"Grape growing & labels",5:"Winemaking",6:"Pinot Noir",7:"Zinfandel / Primitivo",8:"Riesling",9:"Chenin, Sémillon & Furmint",10:"Chardonnay",11:"Sauvignon Blanc",12:"Pinot Grigio / Gris",13:"Gewurz, Viognier & Albariño",14:"Merlot",15:"Cabernet Sauvignon",16:"Syrah / Shiraz",17:"Gamay",18:"Grenache / Garnacha",19:"Tempranillo",20:"Carmenère, Malbec & Pinotage",21:"Cortese, Garganega, Verdicchio & Fiano",22:"Nebbiolo, Barbera & Corvina",23:"Sangiovese & Montepulciano",24:"Sparkling wines",25:"Fortified wines"};
// c=chapter, q=question, s=numbered statements, o=options, a=correct index, e=reasoning
const Q=[
{"c": 1, "q": "Which of the following is the most common colour for red wines?", "o": ["Purple", "Ruby", "Garnet", "Tawny"], "a": 1, "e": "Most red wines sit in the ruby band. Purple points to a very young wine, garnet shows some age, and tawny is very old or deliberately oxidised (think tawny port)."},
{"c": 1, "q": "Which of the following is the most common colour for white wines?", "o": ["Lemon", "Gold", "Amber", "Brown"], "a": 0, "e": "Most whites are lemon. Gold hints at age, oak or sweetness; amber and brown mean a lot of age or oxidation."},
{"c": 1, "q": "Which of the following colours typically best describes a red wine with some age?", "o": ["Ruby", "Garnet", "Purple", "Gold"], "a": 1, "e": "Reds lose colour as they age: purple → ruby → garnet → tawny. Garnet is the classic sign of some bottle age. Gold is a white-wine colour."},
{"c": 1, "q": "Oak and malolactic conversion aromas are considered:", "o": ["Primary Aromas", "Secondary Aromas", "Tertiary Aromas", "Faulted Aromas"], "a": 1, "e": "Primary = from the grape (fruit, flowers). Secondary = from winemaking: oak (vanilla, toast), malolactic (butter, cream), lees (bread). Tertiary = from ageing (mushroom, leather, nuts)."},
{"c": 1, "q": "A wine that has been affected by cork taint will smell of", "o": ["Wet stones", "Damp cardboard", "Petrol", "Green bell pepper"], "a": 1, "e": "Cork taint (TCA) smells musty, like damp cardboard, and dulls the fruit. Wet stone is a Chablis note, petrol is aged Riesling, green pepper is Cabernet or Sauvignon Blanc."},
{"c": 1, "q": "The balance of a wine is best described as:", "o": ["The combination of flavour compounds, sweetness, tannins and acidity.", "The combination of sweetness and body only.", "The combination of acidity and tannins only.", "The body of the wine only."], "a": 0, "e": "Balance is how all the components (fruit and flavour, sweetness, acidity, tannin, alcohol) sit together with nothing sticking out. The other options each leave pieces out."},
{"c": 2, "q": "Which of the following is true about Sweetness in food when pairing with wine?", "o": ["It makes a wine seem more acidic", "It makes a wine seem more bitter", "It makes the wine seem less fruity", "All of the above"], "a": 3, "e": "Sweet food makes wine seem drier, more acidic, more bitter and less fruity. That’s why the wine should be at least as sweet as the food."},
{"c": 2, "q": "Which of the following is true about Umami in food when pairing with wine?", "o": ["It makes a wine seem more bitter", "It makes a wine seem less acidic", "It makes a wine seem sweeter", "None of the above"], "a": 0, "e": "Umami (mushrooms, cured meat, soy) behaves like sweetness: wine seems more bitter, more acidic, less sweet and less fruity. So b and c are the reverse of what happens."},
{"c": 2, "q": "Salty foods can make a wine taste", "o": ["More bitter", "More acidic", "More light bodied", "More fruity"], "a": 3, "e": "Salt is wine-friendly. It softens bitterness and acidity and makes a wine feel fuller and smoother, so it reads as fruitier. Options a–c are the opposite effects."},
{"c": 2, "q": "Acidity in food can make a wine seem:", "o": ["Drier", "More acidic", "More fruity", "More bitter"], "a": 2, "e": "Acidic food makes wine seem less acidic and fruitier or richer. Pair tart dishes with high-acid wines so the wine doesn’t taste flat."},
{"c": 2, "q": "Which statement is true about flavour intensity in food and wine pairing?", "o": ["The flavour intensity of the food should be higher than the flavour intensity of the wine", "The flavour intensity of the wine should be higher than the flavour intensity of the food", "The food and wine should have equal flavour intensities", "None of the above"], "a": 2, "e": "Match intensities so neither overwhelms the other. A delicate dish with a powerful wine (or the reverse) means you only taste one of them."},
{"c": 2, "q": "The effect of chili heat is greatest in which wine style?", "o": ["Wines with higher alcohol", "Wines with lower alcohol", "Wines with residual sugar", "Wines with intense fruity characters"], "a": 0, "e": "Alcohol amplifies the burn of chilli. Lower alcohol, a touch of sweetness and fruity styles all calm it down, which is why off-dry Riesling works with spicy food."},
{"c": 3, "q": "Which statement is most appropriate for storing wine?", "o": ["Poor storage can create faulted wines", "Wines mature well in extremes of temperature", "Wines sealed with a screwcap should be stored on its side", "Bright light helps a wine retain its freshness"], "a": 0, "e": "Heat, light and temperature swings cause faults. Lying bottles down keeps corks moist, which screwcaps don’t need. Light damages wine rather than protecting it."},
{"c": 3, "q": "Which degree is generally accepted as “room temperature?”", "o": ["6°C / 46°F", "12°C / 50°F", "18°C / 64°F", "24°C / 75°F"], "a": 2, "e": "Room temperature for wine means about 15–18°C, the old cellar-cool room. 24°C is too warm and makes reds taste soupy and alcoholic."},
{"c": 3, "q": "Which type of wine is best served in a flute?", "o": ["Sparkling wine", "Dry red wine", "Dry white wine", "Fortified sweet wine"], "a": 0, "e": "The narrow flute keeps the bubbles going. Reds want a bigger bowl, whites a medium glass, fortified wines a small glass."},
{"c": 3, "q": "The ideal set of conditions for long term storage for wine are", "o": ["Cool with bright light", "Warm with bright light", "Cool and away from bright light", "Warm and away from bright light"], "a": 2, "e": "Cool, constant, dark, still and slightly humid. Warmth ages wine too fast and light causes light-strike."},
{"c": 3, "q": "Which of the following wines should be served well chilled 6-8°C (43-46°F)?", "o": ["Beaujolais", "Sauternes", "Pinot Grigio", "Shiraz"], "a": 1, "e": "Sweet wines like Sauternes are served well chilled (6–8°C). Light whites like Pinot Grigio are chilled (7–10°C), light reds like Beaujolais lightly chilled (~13°C), and Shiraz at room temperature."},
{"c": 3, "q": "Which wine should be decanted?", "o": ["Sancerre", "Vintage Port", "Sauternes", "Champagne"], "a": 1, "e": "Vintage Port is bottled unfiltered and throws heavy sediment as it ages, so it needs decanting. The others normally don’t."},
{"c": 3, "q": "When opening a bottle of sparkling wine, one should always:", "o": ["Hold the cork secure while loosening the cage", "Hold the bottle at an angle", "Turn the bottle, not the cork", "All of the above"], "a": 3, "e": "All three are the safe technique: hand over the cork once the cage is loose, bottle at about 45°, twist the bottle so the cork eases out with a sigh, not a pop."},
{"c": 3, "q": "A full-bodied Californian Chardonnay should be served:", "o": ["Chilled", "Lightly chilled", "Well chilled", "Warm"], "a": 1, "e": "Full-bodied, oaked whites are served lightly chilled (10–13°C). Colder than that mutes their complexity."},
{"c": 3, "q": "A blanket system:", "o": ["Chills a wine to proper serving temperature", "Adds a layer of gas to protect remaining wine from oxidation", "Is a decanting method that efficiently allows a wine to breathe", "None of the above"], "a": 1, "e": "It lays an inert gas (like argon or nitrogen) over the wine in an open bottle to slow oxidation. It has nothing to do with chilling or decanting."},
{"c": 4, "q": "Which of the following pairs are found in the pulp of a grape?", "o": ["Tannin", "Colour and tannin", "Seeds and stems", "Sugars and acids"], "a": 3, "e": "Pulp is mostly water, sugar and acid. Colour and tannin come from the skins (tannin also from seeds and stems)."},
{"c": 4, "q": "Fungal diseases can", "o": ["1 only", "2 only", "1 and 3 only", "2 and 3 only"], "s": ["Damage vine leaves", "Increase the yield of the vine", "Spoil the quality of the grapes"], "a": 2, "e": "Mildews and rot attack the leaves and the bunches, cutting both yield and quality. They never increase yield, so any option with statement 2 is out."},
{"c": 4, "q": "Which is the correct order for grape formation and ripening?", "o": ["Flowering, Fruit Set, Véraison, Ripening", "Ripening, Véraison, Fruit Set, Flowering", "Fruit Set, Flowering, Ripening, Véraison", "Véraison, Ripening, Flowering, Fruit Set"], "a": 0, "e": "Flowers first, then fruit set (flowers become tiny berries), then véraison (colour change), then ripening up to harvest."},
{"c": 4, "q": "Which of the following occurs during Véraison?", "o": ["Flowers are pollinated and turn into newly formed grapes", "Grapes change colour from dark green to golden or reddish-purple", "Grapes swell with water and sugars", "Grapes develop tannins and flavours"], "a": 1, "e": "Véraison is the colour change that marks the start of ripening. Option a is fruit set; c and d happen during ripening, after véraison."},
{"c": 4, "q": "An example of a grape that performs better in a warm climate but not in a cool climate is:", "o": ["Chardonnay", "Grenache", "Pinot Noir", "Sauvignon Blanc"], "a": 1, "e": "Grenache ripens late and needs lots of heat (Southern Rhône, Spain, Barossa). Chardonnay, Pinot Noir and Sauvignon Blanc all shine in cool climates."},
{"c": 4, "q": "Most of the world’s vineyards are found between which degrees of latitude?", "o": ["10 to 30° North and South of the Equator", "20 to 40° North and South of the Equator", "30 to 50° North and South of the Equator", "40 to 60° North and South of the Equator"], "a": 2, "e": "Between 30° and 50° there’s enough warmth to ripen grapes and enough of a winter for the vine to rest."},
{"c": 4, "q": "Which weather-related issue can result in wines that are too high in acidity?", "o": ["Cooler than usual vintages", "Drought", "Hail", "High levels of rain"], "a": 0, "e": "In a cool year grapes don’t ripen fully, so acid stays high and sugar low. Drought stresses vines, hail damages them, and rain dilutes or causes rot."},
{"c": 4, "q": "Machine harvesting can be used for:", "o": ["Premium quality wines only", "Bulk inexpensive wines only", "Wines of any quality", "Sparkling wines only"], "a": 2, "e": "Modern harvesters are gentle enough for any quality level. Hand picking is needed for steep slopes, whole bunches or selecting botrytised grapes."},
{"c": 4, "q": "How long can a vine live for?", "o": ["1 year - they are an annual plant", "5-10 years", "10-20 years", "over 60 years - in some cases much older"], "a": 3, "e": "Vines are long-lived perennials. Some are well over 100 years old, hence ‘old vine’ labels."},
{"c": 4, "q": "Grapes harvested later in the ripening process will have:", "o": ["Higher acidity, lower sugars", "Higher sugars, lower acidity", "Higher sugars and acidity", "Lower acidity and sugars"], "a": 1, "e": "As grapes ripen, sugar goes up and acid comes down. Late picking pushes both trends further."},
{"c": 4, "q": "Vendanges tardives indicates a wine made from:", "o": ["Grapes that have been picked later in the harvest season", "Grapes that have been affected by botrytis", "Grapes that have been left to freeze on the vine", "Grapes that have been harvested from old vines"], "a": 0, "e": "It’s French for ‘late harvest’. Botrytis wines in Alsace are Sélection de Grains Nobles; frozen grapes make ice wine."},
{"c": 5, "q": "Fermentation temperature of white wine is:", "o": ["Between 20-32 ºC", "Around 25 ºC", "Between 12-22ºC", "Around 10 ºC"], "a": 2, "e": "Whites ferment cool (12–22°C) to keep delicate fruit aromas. 20–32°C is the red range."},
{"c": 5, "q": "Which is the correct typical order for red winemaking?", "o": ["Pressing, Draining, Fermentation, Maturation", "Fermentation, Draining, Pressing, Maturation", "Draining, Maturation, Pressing, Fermentation", "Maturation, Fermentation, Draining, Pressing"], "a": 1, "e": "Reds ferment on their skins first to get colour and tannin, then the free-run wine is drained, the skins pressed, and the wine matured. Pressing comes after fermentation for reds."},
{"c": 5, "q": "Which is the correct order for dry white winemaking?", "o": ["Crushing, Pressing, Fermentation, Maturation", "Fermentation, Maturation, Crushing, Pressing", "Maturation, Crushing, Pressing, Fermentation", "Pressing, Fermentation, Crushing, Maturation"], "a": 0, "e": "For whites the juice is separated from the skins before fermentation: crush, press, ferment the juice, mature. That’s the reverse of reds."},
{"c": 5, "q": "Extraction of colours in red wines can be done by:", "o": ["Pumping over only", "Pumping over or punching down skins", "Punching down skins only", "This process occurs naturally"], "a": 1, "e": "The skins float up as a cap; both pumping over and punching down keep them in contact with the juice to pull out colour, tannin and flavour."},
{"c": 5, "q": "Fermentation temperature of red wine is:", "o": ["Between 20-32 ºC", "Around 25 ºC", "Between 12-22ºC", "Around 10 ºC"], "a": 0, "e": "Reds ferment warmer (20–32°C) to extract colour and tannin from the skins. 12–22°C is the white range."},
{"c": 5, "q": "Oak barrels can give a wine aromas and flavours of", "o": ["Honey", "Green Bell Pepper", "Petrol", "Vanilla and toast"], "a": 3, "e": "Oak gives vanilla, toast, smoke, clove and coconut. Honey comes from botrytis or age, green pepper from the grape, petrol from aged Riesling."},
{"c": 5, "q": "Lees ageing will give the wine flavours of:", "o": ["Tobacco and forest floor", "Leather and earth", "Biscuit and bread", "Grass and asparagus"], "a": 2, "e": "Dead yeast cells (lees) give bread, biscuit and brioche, plus extra body. Tobacco, leather and earth are tertiary; grass and asparagus are Sauvignon Blanc fruit notes."},
{"c": 6, "q": "Which of the following statements about Pinot Noir is true?", "o": ["Pinot Noir is widely planted as it adapts easily to a variety of climatic conditions", "Pinot Noir can be enjoyed when it is young", "Pinot Noir produces full-bodied wines with strong tannins", "Pinot Noir can withstand intense flavours from new oak"], "a": 1, "e": "Pinot is light to medium bodied with low tannin and bright red fruit, so it’s drinkable young. It’s fussy about climate, low in tannin and easily swamped by new oak."},
{"c": 6, "q": "If a climate or vintage is too warm, the flavours of Pinot Noir will:", "o": ["Be well-suited for several years aging in bottle", "Show unattractive flavours of cooked fruit", "Show subtle flavours of clove and smoke", "Struggle to ripen"], "a": 1, "e": "Too much heat makes Pinot jammy and cooked, losing its freshness. ‘Struggling to ripen’ is the too-cool problem."},
{"c": 6, "q": "A wine labelled Grand Cru in Burgundy", "o": ["Can only be made from Pinot Noir", "Can only be made from Chardonnay", "Must come from a single vineyard", "Can be made from grapes grown anywhere in the region"], "a": 2, "e": "Burgundy’s Grand Crus are individual top vineyards (e.g. Chambertin, Montrachet). Depending on the vineyard the wine may be Pinot Noir or Chardonnay."},
{"c": 6, "q": "Which of the following are famous Pinot Noir producing appellations in Burgundy?", "o": ["1 only", "1,2 and 4 only", "1 and 4 only", "All of the above"], "s": ["Gevrey-Chambertin", "Sauternes", "Sancerre", "Nuits-Saint-Georges"], "a": 2, "e": "Gevrey-Chambertin and Nuits-Saint-Georges are in the Côte de Nuits. Sauternes is sweet Bordeaux and Sancerre is in the Loire."},
{"c": 6, "q": "A cool region of Australia that produces quality Pinot Noir is:", "o": ["Barossa Valley", "Hunter Valley", "Clare Valley", "Yarra Valley"], "a": 3, "e": "Yarra Valley (Victoria) is cool. Barossa is warm Shiraz country, Hunter is known for Semillon, Clare for Riesling."},
{"c": 6, "q": "Which region of New Zealand is not famous for Pinot Noir?", "o": ["Central Otago", "Hawke’s Bay", "Marlborough", "Martinborough"], "a": 1, "e": "Hawke’s Bay is warmer, known for Bordeaux blends and Syrah. Central Otago, Marlborough and Martinborough are all Pinot regions."},
{"c": 6, "q": "Which Chilean region produces very good Pinot Noir?", "o": ["Casablanca Valley", "Central Valley", "Colchagua", "Maipo"], "a": 0, "e": "Casablanca is cooled by Pacific fog and breezes. Central Valley, Colchagua and Maipo are warm, red-wine regions (Cabernet, Carmenère)."},
{"c": 6, "q": "Which region is well known for producing high quality Pinot Noir in South Africa?", "o": ["Mornington Peninsula", "Oregon", "Stellenbosch", "Walker Bay"], "a": 3, "e": "Walker Bay is cooled by the ocean. Stellenbosch is warmer (Cabernet, Pinotage). Mornington is in Australia and Oregon in the USA."},
{"c": 7, "q": "What type of climate is best suited for Zinfandel/Primitivo?", "o": ["Cool Climate", "Moderate Climate", "Warm Climate", "All of the above"], "a": 2, "e": "Zinfandel needs heat. It also ripens unevenly, so a bunch can hold raisined and green berries at the same time."},
{"c": 7, "q": "Which statements about White Zinfandel are true?", "o": ["2 only", "2 & 4", "1, 2, & 4", "All of the above"], "s": ["It is a white wine", "It is medium-sweet", "It is high alcohol", "It is typically aged in oak"], "a": 0, "e": "Despite the name, White Zinfandel is a pale pink (rosé). It’s medium-sweet, low in alcohol and unoaked, so only statement 2 is true."},
{"c": 7, "q": "Premium quality Californian Zinfandel has aromas and flavours of:", "o": ["Blackberry, prune and vanilla", "Ginger, blossom and green fruit", "Raspberry, cherry and almond", "Pineapple, melon and rose"], "a": 0, "e": "Ripe black fruit, dried fruit like prune (from raisined berries) and vanilla from oak. It’s full bodied and high in alcohol."},
{"c": 7, "q": "Which Italian region is the source of wines made from Primitivo?", "o": ["Piemonte", "Puglia", "Tuscany", "Veneto"], "a": 1, "e": "Puglia, the hot ‘heel’ of Italy. Piemonte is Nebbiolo and Barbera, Tuscany Sangiovese, Veneto Corvina and Garganega."},
{"c": 8, "q": "Just-ripe Riesling produces flavours of:", "o": ["Apple, lime, and lemon", "Apricot, mango, and raisins", "Asparagus, green bell pepper, and gooseberry", "Vanilla, coconut, and hazelnut"], "a": 0, "e": "Just ripe means green fruit and citrus. Riper Riesling moves to peach and apricot; raisins point to botrytis. Option c is Sauvignon Blanc, d is oak."},
{"c": 8, "q": "What is the determining factor for each of the German Prädikatswein levels?", "o": ["Vineyard site", "Vintage", "Sugar levels at harvest", "Price"], "a": 2, "e": "The Prädikat levels are set by how ripe (how sugary) the grapes were at harvest. They say nothing about how sweet the finished wine is."},
{"c": 8, "q": "In order of least ripe to most ripe, which of the following is correct?", "o": ["Kabinett, Spätlese, Auslese, Beerenauslese", "Beerenauslese, Auslese, Spätlese, Kabinett", "Auslese, Beerenauslese, Spätlese, Kabinett", "Spätlese, Kabinett, Auslese, Beerenauslese"], "a": 0, "e": "Kabinett → Spätlese → Auslese → Beerenauslese → Trockenbeerenauslese (Eiswein sits alongside BA/TBA)."},
{"c": 8, "q": "Which region typically has lighter-bodied Rieslings that have medium-sweetness?", "o": ["Mosel", "Rheingau", "Pfalz", "Eden Valley"], "a": 0, "e": "Mosel is cool with steep slate slopes: light, low alcohol, often off-dry or medium. Rheingau and Pfalz are fuller and more often dry; Eden Valley is dry."},
{"c": 8, "q": "Which pair of regions produces Australia’s signature Rieslings?", "o": ["Clare Valley and Eden Valley", "Barossa Valley and McLaren Vale", "Yarra Valley and Hunter Valley", "Mornington Peninsula and Margaret River"], "a": 0, "e": "Clare and Eden make dry Rieslings with lime that turn toasty with age. Barossa and McLaren Vale are red country."},
{"c": 8, "q": "Describe a Riesling labelled as Vendanges Tardives in Alsace.", "o": ["Dry with citrus and stone-fruit character.", "Medium with peach and banana aromas.", "Sweet with honey and dried fruit aroma.", "Dry with petrol, lime and blossom."], "a": 2, "e": "Vendanges Tardives means late harvest, so very ripe grapes and a sweet wine with honey and dried fruit. Petrol and lime describe dry aged Riesling."},
{"c": 9, "q": "The grape variety used to make a Vouvray AOC is:", "o": ["Chenin Blanc", "Furmint", "Sémillon", "All of the above"], "a": 0, "e": "Vouvray (Loire) is 100% Chenin Blanc, made dry, off-dry, sweet or sparkling."},
{"c": 9, "q": "In Pessac Léognan (Bordeaux) Sauvignon Blanc is typically blended with:", "o": ["Chenin Blanc", "Sémillon", "Furmint", "Pinot Gris"], "a": 1, "e": "White Bordeaux is Sauvignon Blanc + Sémillon, often oak-aged in Pessac-Léognan and Graves."},
{"c": 9, "q": "A wine labelled Tokaji Aszu is", "o": ["Dry", "Sweet", "Fortified", "Sparkling"], "a": 1, "e": "Tokaji Aszú is Hungary’s sweet wine from botrytised (mainly Furmint) grapes, with high acidity to balance."},
{"c": 9, "q": "South Africa’s most widely planted white grape variety is:", "o": ["Chenin Blanc", "Furmint", "Semillon", "None of the above"], "a": 0, "e": "Chenin Blanc, made in styles from simple and fruity to rich and oaked."},
{"c": 9, "q": "Sauternes wines are based on which variety?", "o": ["Chenin Blanc", "Furmint", "Riesling", "Sémillon"], "a": 3, "e": "Sémillon’s thin skins welcome noble rot (botrytis). It’s blended with some Sauvignon Blanc."},
{"c": 10, "q": "Which of the following statements about Chardonnay is false?", "o": ["Chardonnay is always oaked", "Chardonnay is the grape of Chablis", "Chardonnay is grown in a range of climates", "Chardonnay can show a range of primary fruit characters"], "a": 0, "e": "Plenty of Chardonnay is unoaked (most Chablis, many Mâcon wines). The other three statements are true. Watch for ‘false’ in the question."},
{"c": 10, "q": "Chablis typically has aromas and flavours of", "o": ["Lemon, apple and wet stones", "Pineapple and banana", "Grass, asparagus and passion fruit", "Rose, honey and dried apricot"], "a": 0, "e": "Cool climate, usually unoaked: green apple, lemon, wet stone. Tropical fruit is warm-climate Chardonnay; c is Sauvignon Blanc."},
{"c": 10, "q": "Which winemaking technique is used to give Chardonnay extra body with bread and biscuit flavours?", "o": ["Pumping over", "Punch downs", "Lees stirring", "Flor ageing"], "a": 2, "e": "Lees stirring (bâtonnage) mixes the dead yeast back into the wine. Pumping over and punch downs are red-wine extraction; flor is for sherry."},
{"c": 10, "q": "Quality Australian Chardonnay is produced in which of the following regions.", "o": ["Yarra Valley, Adelaide Hills, Carneros", "Walker Bay, Casablanca, Yarra Valley", "Adelaide Hills, Yarra Valley, Margaret River", "Walker Bay, Carneros, Casablanca"], "a": 2, "e": "Only c is all-Australian. Carneros is California, Walker Bay South Africa, Casablanca Chile."},
{"c": 10, "q": "A full-bodied Chardonnay with tropical fruit and oak flavours describes a wine made from", "o": ["Pomerol AOC", "Pouilly-Fumé AOC", "Pouilly – Fuissé AOC", "Pommard AOC"], "a": 2, "e": "Pouilly-Fuissé (Mâconnais, southern Burgundy) is warmer, giving riper, often oaked Chardonnay. Pouilly-Fumé is Loire Sauvignon Blanc, Pomerol Merlot, Pommard Pinot. A classic trap."},
{"c": 11, "q": "A typical Sauvignon Blanc has aromas of:", "o": ["Strawberry and licorice", "Leather and tobacco", "Grass and citrus", "Petrol and lychee"], "a": 2, "e": "Grass, citrus, green pepper, gooseberry, passion fruit. Petrol is Riesling, lychee Gewurztraminer."},
{"c": 11, "q": "Which of the following is not an AOC for Sauvignon Blanc in the Loire Valley?", "o": ["Sancerre AOC", "Pouilly-Fuissé AOC", "Touraine AOC", "Pouilly-Fumé AOC"], "a": 1, "e": "Pouilly-Fuissé is Burgundy Chardonnay. Sancerre, Touraine and Pouilly-Fumé are Loire Sauvignon Blanc."},
{"c": 11, "q": "The classic home for Sauvignon Blanc in New Zealand is found in:", "o": ["Hawke’s Bay", "Marlborough", "Central Otago", "Walker Bay"], "a": 1, "e": "Marlborough, with its pungent passion fruit and grass. Walker Bay is in South Africa."},
{"c": 11, "q": "Premium quality Chilean Sauvignon Blanc is produced in which one of the following regions?", "o": ["Carneros", "Casablanca", "Condrieu", "Coonawarra"], "a": 1, "e": "Casablanca is cooled by Pacific fog. Carneros is California, Condrieu is Viognier in France, Coonawarra is Australian Cabernet."},
{"c": 11, "q": "Which pair of regions are known for Sauvignon Blanc in Australia?", "o": ["Adelaide Hills and Margaret River", "Hunter Valley and Barossa Valley", "Eden Valley and Clare Valley", "Yarra Valley and Mornington Peninsula"], "a": 0, "e": "Adelaide Hills (varietal) and Margaret River (often blended with Semillon). Eden and Clare are Riesling; Yarra and Mornington are Pinot and Chardonnay."},
{"c": 11, "q": "What pair of regions in South Africa are famous for Sauvignon Blanc?", "o": ["Casablanca Valley and Central Valley", "Constantia and Elgin", "Napa Valley and Sonoma", "Walker Bay and Western Cape"], "a": 1, "e": "Constantia and Elgin are cool and ocean-influenced. Option a is Chile, c California, and Western Cape is the whole wine region."},
{"c": 12, "q": "Pinot Grigio labelled delle Venezie DOC are typically:", "o": ["Complex and ageworthy", "Simple and inexpensive", "Full bodied and oaked", "Medium sweet and expensive"], "a": 1, "e": "A big region in north-east Italy with high yields: light, neutral, crisp and cheap."},
{"c": 12, "q": "Which most contributes to the stylistic differences between a Pinot Grigio and a Pinot Gris?", "o": ["Grape-growing and harvesting choices", "Fermentation choices", "Maturation choices", "Packaging choices"], "a": 0, "e": "Same grape. Grigio is picked early at high yields (light, crisp); Gris (Alsace) is low-yield and picked riper (rich, full). It’s decided in the vineyard."},
{"c": 12, "q": "Compared to Italian Pinot Grigio, Pinot Gris from Alsace is typically:", "o": ["Lower in acidity with a fuller body", "Higher in acidity with a fuller body", "Lower in acidity with a lighter body", "Higher in acidity with a lighter body"], "a": 0, "e": "Riper grapes mean less acid and more sugar and alcohol, so a fuller body."},
{"c": 12, "q": "Typical aromas and flavours for Pinot Gris in Alsace are:", "o": ["Lemon, apple, and honey", "Peach, mango, and ginger", "Rose, clove and banana", "Strawberry, clove and mushroom"], "a": 1, "e": "Stone fruit, tropical fruit and ginger spice, with honey developing in bottle. Rose and lychee belong to Gewurztraminer."},
{"c": 12, "q": "What vessel is Pinot Grigio usually fermented in?", "o": ["New oak barriques", "Stainless steel tanks", "Large old oak vessels", "Amphorae"], "a": 1, "e": "Stainless steel keeps the fresh, neutral fruit and is cheap and efficient, which fits the style."},
{"c": 12, "q": "Bottle ageing an Alsace Pinot Gris would typically develop flavours of:", "o": ["Vanilla and toast", "Mushroom and earth", "Rose and leather", "Ginger and honey"], "a": 3, "e": "Age brings honey and dried fruit on top of the ginger spice. Vanilla and toast come from oak; mushroom and earth are red-wine tertiary notes."},
{"c": 12, "q": "Vendanges Tardives Pinot Gris wines are what level of sweetness?", "o": ["Dry only", "Off Dry only", "Dry to Off Dry", "Medium to Sweet"], "a": 3, "e": "Late-harvested, very ripe grapes leave sugar in the wine, so medium to sweet."},
{"c": 13, "q": "The key aroma characteristics of Gewurztraminer are", "o": ["Rose and lychee", "Grass and asparagus", "Vanilla and toast", "Lime and green apple"], "a": 0, "e": "Rose, lychee, ginger and sweet spice. It’s one of the easiest grapes to spot by smell."},
{"c": 13, "q": "Which of the following best describes a Gewurztraminer from the Alsace region", "o": ["High acidity, light bodied and low in alcohol", "High acidity, full bodied and low in alcohol", "Low acidity, light bodied and high in alcohol", "Low acidity, full bodied, high in alcohol"], "a": 3, "e": "Gewurztraminer builds lots of sugar and loses acid, giving full body, high alcohol and low acidity, often with deep colour."},
{"c": 13, "q": "Albariño is the white grape of which region?", "o": ["Priorat DOCa", "Rías Baixas DO", "Ribera del Duero DO", "Rioja DOCa"], "a": 1, "e": "Rías Baixas in Galicia, Atlantic north-west Spain. Priorat is Garnacha; Ribera and Rioja are Tempranillo."},
{"c": 13, "q": "Albariño typically has aromas and flavours of", "o": ["Grass and passion fruit", "Apricot and pineapple", "Lemon and peach", "Raspberry and red cherry"], "a": 2, "e": "Fresh citrus (lemon, grapefruit) and stone fruit (peach), with high acidity. Grass and passion fruit point to Sauvignon Blanc."},
{"c": 13, "q": "Which AOC is home to the finest examples of Viognier?", "o": ["Condrieu AOC", "Côte-Rôtie AOC", "Graves AOC", "Touraine AOC"], "a": 0, "e": "Condrieu in the Northern Rhône. Côte-Rôtie is Syrah (sometimes with a dash of Viognier), Graves is white Bordeaux, Touraine is Loire Sauvignon."},
{"c": 14, "q": "Riper Merlot from a warmer climate will show primary flavours of:", "o": ["Blackcurrant and green bell pepper", "Blackberry and black plum", "Green apple and lemon", "Strawberry and black pepper"], "a": 1, "e": "Warm-climate Merlot is ripe black fruit (blackberry, plum, fruitcake). Green pepper is a sign of less ripe or cool-climate fruit."},
{"c": 14, "q": "Which of the following Bordeaux communes is on the Right Bank?", "o": ["Pomerol", "Pessac-Léognan", "Pauillac", "Margaux"], "a": 0, "e": "Right Bank = Pomerol and St-Émilion (Merlot on clay). Pessac-Léognan, Pauillac and Margaux are Left Bank, Cabernet on gravel."},
{"c": 14, "q": "Which of the following AOCs would be mostly Merlot?", "o": ["Haut-Médoc AOC", "Graves AOC", "St.-Émilion Grand Cru AOC", "Pessac-Léognan AOC"], "a": 2, "e": "St-Émilion is Right Bank, so Merlot-led. The other three are Left Bank, Cabernet-led."},
{"c": 14, "q": "Which Chilean region typically produces soft medium-bodied Merlots from high yields?", "o": ["Casablanca Valley", "Central Valley", "Colchagua", "Maipo"], "a": 1, "e": "Central Valley is warm, fertile and productive: the source of Chile’s volume wines."},
{"c": 14, "q": "In which Australian region does Merlot play an important role in blends with Cabernet Sauvignon?", "o": ["Barossa Valley", "Coonawarra", "Margaret River", "Mornington Peninsula"], "a": 2, "e": "Margaret River is known for elegant Bordeaux-style Cabernet–Merlot blends. Barossa is Shiraz, Mornington Pinot; Coonawarra is famous for varietal Cabernet."},
{"c": 15, "q": "Which of the following statements best describes a Cabernet Sauvignon?", "o": ["High tannin, pronounced aromatics, high acidity", "Medium tannin, medium aromatics, full body", "Soft tannin, medium aromatics, light body", "High tannins, high aromatics, medium acidity"], "a": 0, "e": "Small, thick-skinned berries give deep colour, high tannin and high acidity, with pronounced blackcurrant aromas."},
{"c": 15, "q": "Which flavour profile best describes a Cabernet Sauvignon?", "o": ["Strawberry, mushroom, and barnyard", "Black currants, bell pepper, and mint", "Plum, dark cherry, and coffee", "Blackberry, black pepper, and liquorice"], "a": 1, "e": "Blackcurrant plus green notes (bell pepper, mint). Option a is aged Pinot, c Merlot, d Syrah."},
{"c": 15, "q": "Which of the following statements about Cabernet Sauvignon is true?", "o": ["It ripens easily so can be grown in either a cool or warm climate", "It has its classic home on the Right Bank of Bordeaux", "Its high acidity and high tannins enable it to age for a long time", "All of the above"], "a": 2, "e": "It’s a late ripener needing warmth, and its home is the Left Bank (Right Bank is Merlot). Only c is true."},
{"c": 15, "q": "Premium South African Cabernet Sauvignon is produced in?", "o": ["Casablanca Valley", "Margaret River", "Stellenbosch", "Pomerol"], "a": 2, "e": "Stellenbosch. The others are in Chile, Australia and Bordeaux."},
{"c": 15, "q": "Which region has established itself as a source of premium quality Cabernet Sauvignon in Australia that shows a distinctive minty character?", "o": ["Coonawarra", "Barossa Valley", "Hawke’s Bay", "Oakville"], "a": 0, "e": "Coonawarra, on its red terra rossa soil, with mint and eucalyptus notes. Hawke’s Bay is NZ and Oakville is in Napa."},
{"c": 15, "q": "Which of the following statements about Napa Valley Cabernet Sauvignon is false:", "o": ["It is a full bodied wine with high, ripe tannins", "It has pronounced flavours of black fruits and oak", "It is sometimes blended with small amounts of other grape varieties", "It is difficult to ripen in the California climate"], "a": 3, "e": "Napa is warm and sunny, so Cabernet ripens easily there. That’s why its wines are so full and ripe. The other three are true."},
{"c": 15, "q": "Which Chilean region is not a major source of Cabernet Sauvignon?", "o": ["Casablanca", "Central Valley", "Colchagua", "Maipo"], "a": 0, "e": "Casablanca is too cool for late-ripening Cabernet; it’s for whites and Pinot Noir."},
{"c": 15, "q": "If Cru Bourgeois is written on a bottle of Bordeaux what does it mean?", "o": ["A St Emilion Bordeaux of the highest classification", "A good quality wine from the Medoc that is not within the Grand Cru Classé system", "A sweet uncategorised wine from Sauternes", "A white blend from the Graves region"], "a": 1, "e": "Cru Bourgeois is the Médoc’s classification for good châteaux that aren’t in the 1855 Grand Cru Classé list."},
{"c": 16, "q": "Which flavour profile best describes a Syrah?", "o": ["Strawberry, mushroom, and barnyard", "Black currants, green bell pepper, and cedar", "Red Plum, dark cherry, and coffee", "Blackberry, black pepper, and herbal"], "a": 3, "e": "Blackberry, black pepper and herbs, with smoke and meat as it ages. Option b is Cabernet, c Merlot."},
{"c": 16, "q": "Syrah is best suited to which climate types", "o": ["Cool only", "Cool and moderate only", "Cool, moderate and warm", "Moderate and warm only"], "a": 3, "e": "Moderate (Northern Rhône: peppery, elegant) and warm (Barossa: ripe, rich). It struggles to ripen in cool climates."},
{"c": 16, "q": "Syrah is used to blend with Grenache to bring:", "o": ["More colour and softer tannins", "Lighter colour and higher tannins", "More colour and higher tannins", "Light colour and lower tannins"], "a": 2, "e": "Grenache is pale with soft tannin. Syrah adds colour, tannin and structure."},
{"c": 16, "q": "The classic region for Syrah is:", "o": ["The Northern Rhône", "The Southern Rhône", "The Left Bank", "The Right Bank"], "a": 0, "e": "Northern Rhône. The Southern Rhône is Grenache-led; the Left and Right Banks are Bordeaux."},
{"c": 16, "q": "The best French appellations for Syrah are:", "o": ["Chambertin and Montrachet", "Côte-Rôtie and Hermitage", "Margaux and Pauillac", "St.-Émilion and Pomerol"], "a": 1, "e": "Côte-Rôtie and Hermitage (Northern Rhône). Chambertin and Montrachet are Burgundy, Margaux and Pauillac Left Bank, St-Émilion and Pomerol Right Bank."},
{"c": 16, "q": "Why are Syrah grapes hand-harvested in the Rhône Valley?", "o": ["Grapes are harvested from old vines", "Noble rot only affects some of the grapes", "Vines are planted in gravel soils", "Vineyards are planted on steep slopes"], "a": 3, "e": "The Northern Rhône’s steep terraces are too steep for machines. Noble rot is a sweet-wine story (Sauternes)."},
{"c": 16, "q": "Which region of Australia is home to some of the country's oldest Syrah vines and produces full bodied wines with ripe tannins and cooked black fruit flavours?", "o": ["Hunter Valley", "Barossa Valley", "Margaret River", "Eden Valley"], "a": 1, "e": "Barossa: warm, with century-old Shiraz vines, giving rich, ripe, cooked black fruit."},
{"c": 17, "h": ["Acidity", "Tannins", "Flavours"], "q": "Which best describes a wine made from Gamay?", "o": ["Low · High · Strawberry and Mint", "Medium · Medium · Dark Plum and Blackberry", "Medium to High · Low · Apple and Lemon", "High · Low to Medium · Red Cherry and Raspberry"], "a": 3, "e": "Light, fresh and fruity: high acidity, low to medium tannin, red cherry and raspberry."},
{"c": 17, "q": "Which region is famous for producing wines made from Gamay?", "o": ["Beaujolais", "Burgundy", "Rhône Valley", "Rioja"], "a": 0, "e": "Beaujolais, just south of Burgundy. Burgundy reds are Pinot Noir, the Rhône is Syrah/Grenache, Rioja is Tempranillo."},
{"c": 17, "q": "The order of quality in Beaujolais from low to high is", "o": ["Beaujolais Villages AOC, Beaujolais AOC, Beaujolais Cru AOC", "Beaujolais AOC, Beaujolais Villages AOC, Beaujolais Cru AOC", "Beaujolais Cru AOC, Beaujolais Villages AOC, Beaujolais AOC", "Beaujolais Cru AOC, Beaujolais AOC, Beaujolais Villages AOC"], "a": 1, "e": "Beaujolais AOC → Beaujolais-Villages AOC → the 10 named crus."},
{"c": 17, "q": "Which of these is a cru that produces wines made from Gamay?", "o": ["Beaune", "Fleurie", "Hermitage", "Minervois"], "a": 1, "e": "Fleurie is one of the 10 Beaujolais crus (with Morgon, Moulin-à-Vent and others). Beaune is Burgundy, Hermitage Syrah, Minervois Languedoc."},
{"c": 18, "q": "Which of the following would be a good description of a Grenache grape?", "o": ["High sugars, thin skins, and low acidity", "Low sugars, thin skins, and medium acidity", "Low sugars, thick skins, and medium acidity", "High sugars, thick skins, and high acidity"], "a": 0, "e": "Thin skins (pale colour, soft tannin), lots of sugar (high alcohol) and low acidity."},
{"c": 18, "q": "Which flavour profile best describes a Grenache?", "o": ["Strawberry, raspberry, and white pepper", "Black currants, bell pepper, and cedar", "Plum, dark cherry, and coffee", "Blackberry, black pepper, and liquorice"], "a": 0, "e": "Red fruit (strawberry, raspberry) with white pepper and herbs. Option b is Cabernet, d Syrah."},
{"c": 18, "q": "Which one of the following red grape varieties needs the most heat to ripen fully?", "o": ["Grenache", "Pinot Noir", "Gamay", "Tempranillo"], "a": 0, "e": "Grenache ripens very late. Pinot and Gamay are cool-climate grapes; Tempranillo is moderate."},
{"c": 18, "q": "Which pair of grape varieties are commonly blended with Grenache?", "o": ["Cabernet Sauvignon and Merlot", "Gamay and Pinot Noir", "Sangiovese and Primitivo", "Syrah and Tempranillo"], "a": 3, "e": "Syrah (Rhône and Australian GSM blends) and Tempranillo (Rioja)."},
{"c": 18, "q": "Grenache is often used to produce rosé wines.", "o": ["True", "False"], "a": 0, "e": "True. Thin skins, pale colour and red fruit make it ideal for rosé (Provence, Tavel, Navarra)."},
{"c": 18, "q": "Which region would see red wines made mostly from Grenache?", "o": ["Côtes du Rhône", "Côte de Beaune", "Côte-Rôtie", "Côte de Nuits"], "a": 0, "e": "Côtes du Rhône comes mainly from the Southern Rhône, where Grenache dominates. Côte de Beaune and Côte de Nuits are Burgundy Pinot; Côte-Rôtie is Syrah."},
{"c": 18, "q": "Which of the following is a Grenache-based cru in the Southern Rhône?", "o": ["Châteauneuf-du-Pape AOC", "Condrieu AOC", "Hermitage AOC", "Minervois AOC"], "a": 0, "e": "Châteauneuf-du-Pape. Condrieu (Viognier) and Hermitage (Syrah) are Northern Rhône; Minervois is Languedoc."},
{"c": 18, "q": "The most powerful expression of Garnacha in Spain is from:", "o": ["Catalunya DO", "Navarra DO", "Priorat DOCa", "Rioja DOCa"], "a": 2, "e": "Priorat: old vines on slate soils, giving concentrated, high-alcohol wines."},
{"c": 18, "q": "Which of the following pairs of regions is home to many old vine Grenache?", "o": ["Barossa Valley and McLaren Vale", "Casablanca Valley and Colchagua", "Central Otago and Hawke’s Bay", "Stellenbosch and Walker Bay"], "a": 0, "e": "Barossa and McLaren Vale in South Australia have old bush-vine Grenache."},
{"c": 19, "h": ["Acidity", "Tannins", "Flavours"], "q": "Which best describes a wine made from Tempranillo?", "o": ["Low · High · Blackcurrant and Green Bell Pepper", "Medium · Medium · Red Cherry and Blackberry", "Medium to High · Low · Peach and Pineapple", "High · Medium to High · Dark Plum and Black pepper"], "a": 1, "e": "Medium acidity and tannin, red cherry and blackberry. Its fruit pairs well with oak, hence the vanilla and coconut in Rioja."},
{"c": 19, "q": "Which region is the most famous for Tempranillo-based wines in Spain?", "o": ["Catalunya DO", "Priorat DOCa", "Rías Baixas DO", "Rioja DOCa"], "a": 3, "e": "Rioja. Priorat is Garnacha and Rías Baixas is white Albariño."},
{"c": 19, "q": "In which region is Tempranillo very full-bodied and have dark fruit character?", "o": ["Rías Baixas DO", "Ribera del Duero DO", "Rioja DOCa", "All of the above"], "a": 1, "e": "Ribera del Duero’s altitude gives hot days and cold nights, making deeper, fuller, darker wines than Rioja. Rías Baixas makes white wine."},
{"c": 19, "q": "Which is the correct order for aging minimums in Spain from shortest to longest?", "o": ["Crianza, Joven, Gran Reserva, Reserva", "Gran Reserva, Reserva, Crianza, Joven", "Joven, Crianza, Reserva, Gran Reserva", "Reserva, Gran Reserva, Joven, Crianza"], "a": 2, "e": "Joven (young, little or no oak) → Crianza → Reserva → Gran Reserva."},
{"c": 19, "q": "With age, good quality Tempranillo can develop tertiary flavours of:", "o": ["Petrol and honey", "Brioche and toast", "Caramel and almonds", "Mushroom and dried fruit"], "a": 3, "e": "Mushroom, dried fruit, leather and tobacco. Petrol and honey are aged Riesling; brioche is lees; caramel and almonds suggest oxidative wines like Oloroso."},
{"c": 20, "q": "What best describes a typical Carmenère?", "o": ["Full bodied with high acidity and deeply coloured", "Medium bodied with low to medium acidity and deeply coloured", "Full bodied with medium to high acidity and lightly coloured", "Medium bodied with low to medium acidity and lightly coloured"], "a": 0, "e": "This answer key has Carmenère as full bodied, high acid and deeply coloured, with black fruit and herbaceous notes. ‘Lightly coloured’ is the giveaway wrong part in c and d."},
{"c": 20, "q": "If harvested when unripe Carmenère's flavours can be:", "o": ["Lemon, lime and apple", "Full dark fruit", "Bright Red fruit", "Pungent green bell pepper and tomato leaf"], "a": 3, "e": "Like Cabernet, Carmenère has green pyrazine compounds that dominate when it’s picked unripe."},
{"c": 20, "q": "Which variety native to Bordeaux is widely grown in Chile?", "o": ["Carmenère", "Malbec", "Pinotage", "Sémillon"], "a": 0, "e": "Carmenère nearly vanished from Bordeaux after phylloxera and was rediscovered in Chile (long mistaken for Merlot). Malbec is also Bordeaux-born but famous in Argentina."},
{"c": 20, "q": "What best describes a typical Malbec?", "o": ["Full bodied with high tannins and flavours of black fruit", "Medium bodied with low to medium acidity and flavours of red fruit", "Full bodied with medium to high acidity and herbaceous flavours", "Medium bodied with low to medium acidity and red and dark fruit"], "a": 0, "e": "Deep colour, full body, high tannin, blackberry and plum, often with oak."},
{"c": 20, "q": "The most plantings of Malbec are found in:", "o": ["Casablanca", "Mendoza", "Chianti", "Central Valley"], "a": 1, "e": "Mendoza, Argentina, where high altitude keeps the fruit fresh. Chianti is Sangiovese."},
{"c": 20, "q": "Pinotage typically has red fruit characteristics", "o": ["True", "False"], "a": 0, "e": "True per this key. Pinotage (Pinot Noir × Cinsault) can show red fruit along with smoky, earthy notes."},
{"c": 20, "q": "Pinotage is sometimes blended with Cabernet Sauvignon and Merlot to create:", "o": ["Amarone della Valpolicella", "Cape Blends", "Côtes du Rhône-Villages", "Méthode Cap Classique"], "a": 1, "e": "Cape Blends are South African reds that include Pinotage. Méthode Cap Classique is South African traditional-method sparkling."},
{"c": 21, "q": "The grape of Soave DOC and Soave Classico DOC is:", "o": ["Cortese", "Fiano", "Garganega", "Verdicchio"], "a": 2, "e": "Garganega, in the Veneto."},
{"c": 21, "q": "Gavi DOCG is typically", "o": ["High in tannin", "Aged in new oak barrels", "Fortified", "Ready to drink on release"], "a": 3, "e": "Gavi is light, crisp, unoaked white wine made to drink young. White wines don’t have meaningful tannin."},
{"c": 21, "q": "The main grape of Gavi DOCG is:", "o": ["Cortese", "Fiano", "Garganega", "Verdicchio"], "a": 0, "e": "Cortese, from Piemonte. Memory hook: Gavi and Cortese are both in Piemonte."},
{"c": 21, "q": "Typical aromas and flavours of Fiano include:", "o": ["Blossom, pear, and vanilla", "Lemon, fennel, and apple", "Peach, melon, and mango", "Strawberry, raspberry, and red cherry"], "a": 2, "e": "Fiano (Campania) is stone and tropical fruit, and can age into honey and nuts."},
{"c": 21, "q": "Most wines labelled Verdicchio are:", "o": ["complex with notes of honey and nuts", "simple with floral aromas and should only be aged for up to 5 years", "simple, fruity and not intended for ageing", "complex with floral aromas and not intended for ageing"], "a": 2, "e": "Most are simple, fresh and fruity for drinking young; only the best examples age."},
{"c": 22, "q": "Which grape is used to make Barolo and Barbaresco DOCG?", "o": ["Barbera", "Corvina", "Nebbiolo", "Sangiovese"], "a": 2, "e": "Nebbiolo, Piemonte’s top grape."},
{"c": 22, "q": "Which of the below is not a red wine from Piemonte?", "o": ["Brunello di Montalcino DOCG", "Barolo DOCG", "Barbera d’Asti DOCG", "Barbaresco DOCG"], "a": 0, "e": "Brunello di Montalcino is Tuscan Sangiovese. The other three are Piemonte."},
{"c": 22, "q": "High acidity, high tannins, with red-fruit, dried herbs, and floral aromas best describes a:", "o": ["Barbera", "Corvina", "Nebbiolo", "Montepulciano"], "a": 2, "e": "Nebbiolo is pale in colour but high in tannin and acid, with rose, cherry and dried herbs. Barbera has low tannin; Montepulciano is deep and soft."},
{"c": 22, "q": "Which is the main grape of a Valpolicella blend?", "o": ["Barbera", "Corvina", "Garganega", "Nebbiolo"], "a": 1, "e": "Corvina. Garganega is the white grape of Soave, from the same region."},
{"c": 22, "q": "Which pair of wines are made using the appassimento method?", "o": ["Amarone della Valpolicella DOCG & Valpolicella Classico DOC", "Recioto della Valpolicella DOCG & Amarone della Valpolicella DOCG", "Valpolicella DOC & Valpolicella Classico DOC", "Valpolicella Classico DOC & Recioto della Valpolicella DOCG"], "a": 1, "e": "Appassimento means drying grapes to concentrate them. Recioto is the sweet version and Amarone the dry one. Basic Valpolicella uses fresh grapes."},
{"c": 22, "q": "Barbera produces wines that have:", "o": ["Low acidity and low tannin", "High acidity and high tannin", "Low acidity and medium to high tannin", "High acidity and low to medium tannins"], "a": 3, "e": "High acid, soft tannin, deep colour and red fruit. High acid AND high tannin is Nebbiolo."},
{"c": 23, "h": ["Acidity", "Tannins", "Aromas"], "q": "Which of the following best describes a wine made from Sangiovese?", "o": ["Low · Low · Red Cherry, Red Plum", "Medium · Medium · Black Cherry, Black Plum", "Medium to High · Medium · Peach, Pineapple", "High · High · Red Cherry, Dried Herbs"], "a": 3, "e": "High acid and high tannin, with red cherry, plum and dried herbs."},
{"c": 23, "q": "The term Classico on an Italian label indicates:", "o": ["The wine is made from Sangiovese", "The wine comes from a historic centre of a wine region", "The wine has been aged for a minimum set number of months", "Both the grape variety and the wine region"], "a": 1, "e": "Classico is the original historic heartland (e.g. Chianti Classico). Ageing is what Riserva tells you."},
{"c": 23, "q": "The term riserva on an Italian wine label indicates:", "o": ["The wine has been aged for a set number of months", "The wine is of a lower minimum alcohol", "The wine is from the best vineyards", "None of the above; it has no legal implications"], "a": 0, "e": "Riserva is a legal term for extra minimum ageing (often with a higher, not lower, minimum alcohol)."},
{"c": 23, "q": "Which of these wines is not made with Sangiovese?", "o": ["Chianti Classico", "Brunello di Montalcino", "Montepulciano d’Abruzzo", "None of the above"], "a": 2, "e": "Montepulciano d’Abruzzo is made from the Montepulciano grape. Trap: Vino Nobile di Montepulciano is a Tuscan town’s wine and IS Sangiovese."},
{"c": 23, "q": "What style of wines is Brunello di Montalcino?", "o": ["Traditional method sparkling wine", "Sweet with high alcohol and low tannins", "Full bodied ageworthy red wine", "Floral with low alcohol and a light body"], "a": 2, "e": "100% Sangiovese with long required ageing: full bodied, structured and built to age."},
{"c": 23, "q": "Montepulciano d’Abruzzo DOC is typically", "o": ["High volume, inexpensive, white wine", "High volume, inexpensive red wine", "Premium quality white wine", "Premium quality red wine"], "a": 1, "e": "A widely made, good-value red: deep colour, soft tannin, plummy fruit. Montepulciano is a red grape."},
{"c": 24, "q": "Non-vintage Champagne", "o": ["Is made from Chenin Blanc", "Is made using the tank method", "Can be made anywhere in France", "Is a blend of different years"], "a": 3, "e": "NV blends years for a consistent house style. It uses Chardonnay, Pinot Noir and Meunier, the traditional method, and must come from Champagne."},
{"c": 24, "q": "Which one of the following lists the correct order for making traditional sparkling wine", "o": ["Riddling, autolysis, dosage, disgorging", "Disgorging, dosage, riddling, autolysis", "Dosage, riddling, autolysis, disgorging", "Autolysis, riddling, disgorging, dosage"], "a": 3, "e": "After the second fermentation in bottle: ageing on lees (autolysis) → riddling (yeast to the neck) → disgorging (yeast out) → dosage (top-up that sets sweetness)."},
{"c": 24, "q": "Autolysis in sparkling wines results in", "o": ["Floral and grape flavors", "High alcohol", "Bread and biscuit notes", "Low alcohol"], "a": 2, "e": "The breakdown of dead yeast gives bread, biscuit and toast. Alcohol comes from fermentation, not autolysis."},
{"c": 24, "q": "Dosage is part of the production process for", "o": ["Fino sherry", "Vintage Port", "Sauternes", "Champagne"], "a": 3, "e": "Dosage is the wine-and-sugar mix added after disgorging to set the sweetness of a sparkling wine."},
{"c": 24, "q": "Prosecco DOC is a sparkling wine made from", "o": ["Chardonnay", "Cortese", "Glera", "Pinot Grigio"], "a": 2, "e": "Glera, made by the tank method to keep its fresh pear and apple fruit."},
{"c": 24, "q": "Asti DOCG is a sweet fruity sparkling wine made from", "o": ["Muscat", "Furmint", "Verdicchio", "Garganega"], "a": 0, "e": "Muscat (Moscato Bianco): sweet, low alcohol, grapey and floral."},
{"c": 24, "q": "Methode Cap Classique indicates that a wine has been made using", "o": ["The Asti method", "The tank method", "The traditional method", "The transfer method"], "a": 2, "e": "MCC is South Africa’s term for traditional-method sparkling (second fermentation in bottle)."},
{"c": 24, "q": "Which style of sparkling wine is not a tank-method sparkling wine?", "o": ["Asti", "Cava", "Prosecco", "None of the above"], "a": 1, "e": "Cava uses the traditional method, like Champagne. Asti and Prosecco are made in tanks."},
{"c": 24, "q": "The term ‘brut’ refers to a sparkling wine that is:", "o": ["A blend of different vintages", "Lightly-sparkling", "Dry", "Medium-sweet"], "a": 2, "e": "Brut means dry (little dosage). It’s the most common Champagne style."},
{"c": 25, "q": "The base wine used to make Fino Sherry is", "o": ["Dry and tannic red wine", "Sweet fruity red wine", "Simple dry white wine", "Sweet white wine"], "a": 2, "e": "A neutral, dry white from Palomino, fermented dry and then fortified."},
{"c": 25, "q": "What gives Fino Sherry its distinctive bready flavor?", "o": ["Oxidation", "Bottle ageing", "Botrytis", "Flor"], "a": 3, "e": "Flor is a layer of yeast on the wine’s surface that blocks oxygen and adds bready, almond notes. Oxidation is the Oloroso route."},
{"c": 25, "q": "A wine labelled Oloroso is", "o": ["An oaked aged Port", "A sparkling wine from Italy", "A late harvest wine from Alsace", "A sherry that has been aged oxidatively without flor"], "a": 3, "e": "Oloroso is fortified high enough to kill flor, then aged in contact with oxygen: brown, nutty, and normally dry."},
{"c": 25, "q": "In Sherry fortification takes place", "o": ["After maturation", "During fermentation", "After fermentation", "During maturation"], "a": 2, "e": "Sherry ferments fully dry, then is fortified. Port is fortified during fermentation, which is why Port is sweet."},
{"c": 25, "q": "What is the name of the aging technique responsible for producing Sherry?", "o": ["Gran Reserva", "Malolactic Conversion", "Solera System", "Traditional Method"], "a": 2, "e": "The solera fractionally blends younger wine into older barrels for a consistent style. Gran Reserva is a Spanish age term; traditional method is for sparkling."},
{"c": 25, "q": "Which one of the following best describes Vintage Port?", "o": ["Simple with low tannins", "Dry with aromas of dried fruits", "Sweet, complex and concentrated", "Sweet with notes of honey, apricot, and marmalade"], "a": 2, "e": "Sweet, full, high tannin, intense black fruit, built for decades. Honey and apricot describe sweet whites like Sauternes or Tokaji."},
{"c": 25, "q": "The color of a Vintage Port after extended maturation in bottle changes from", "o": ["Ruby to garnet", "Garnet to ruby", "Garnet to gold", "Gold to garnet"], "a": 0, "e": "Like any red, it loses colour with age: ruby → garnet. Gold is a white-wine colour."},
{"c": 25, "q": "Which of the following might have an aged indication on the bottle of 10, 20, 30 or 40 years?", "o": ["Ruby Port", "Tawny Port", "Late Bottled Vintage Port", "Vintage Port"], "a": 1, "e": "Aged Tawny Port. The number is an average age of the blend, not a vintage."},
{"c": 25, "q": "The addition of grape spirit in Port production", "o": ["Stops the fermentation process", "Makes the Port drier", "Produces a lighter color"], "a": 0, "e": "The spirit kills the yeast mid-fermentation, leaving natural grape sugar in the wine. That makes Port sweet, the opposite of b."},
{"c": 1, "q": "How should you hold the glass to judge the colour intensity of a wine?", "o": ["Swirled hard so the colour spreads", "At a 45° angle, looking from the core out to the rim", "Upright, looking at the wine from the side", "Raised to eye level against a bright window"], "a": 1, "e": "Tilt the glass to 45° and see how far the colour reaches from the core to the rim. For reds you can also look down through an upright glass and see how easily the stem shows.", "x": 1},
{"c": 1, "q": "Which two features make the ISO glass suitable for tasting?", "o": ["Coloured glass and a heavy base", "A rounded bowl and inward-sloping walls", "A tall, narrow flute shape and a thin rim", "A wide, flat bowl and a short stem"], "a": 1, "e": "The rounded bowl helps you swirl to release aromas, and the walls slope inwards to capture them at the top of the glass.", "x": 1},
{"c": 1, "q": "A rosé in which orange is the dominant colour is described as:", "o": ["Pink-orange", "Pink", "Orange", "Amber"], "a": 2, "e": "The rosé scale runs pink → pink-orange → orange. Orange-dominant rosés are very rare.", "x": 1},
{"c": 1, "q": "A white wine with a hint of orange or brown in its colour is described as:", "o": ["Amber", "Lemon", "Garnet", "Gold"], "a": 3, "e": "Whites run lemon → gold → amber. A hint of orange or brown makes it gold; very noticeable browning makes it amber.", "x": 1},
{"c": 1, "q": "A red wine that is more brown than red is described as:", "o": ["Tawny", "Garnet", "Amber", "Ruby"], "a": 0, "e": "Garnet shows orange or brown but is still more red than brown. Once it's more brown than red, it's tawny.", "x": 1},
{"c": 1, "q": "Primary aromas in a wine come from:", "o": ["Bottle ageing", "Oak maturation", "The grapes, or are created during fermentation", "Malolactic conversion"], "a": 2, "e": "Primary = grape and fermentation (fruit, floral, herbaceous). Secondary = post-fermentation winemaking. Tertiary = ageing.", "x": 1},
{"c": 1, "q": "Aromas of petrol, honey and mushroom are tertiary aromas that typically come from:", "o": ["A long period of ageing in bottle, protected from oxygen", "A long period in oak, in contact with oxygen", "Cool fermentation", "Lees ageing"], "a": 0, "e": "Oxidative ageing (e.g. a long time in oak) adds coffee or caramel. Ageing protected from oxygen (e.g. a long time in bottle) adds petrol, honey or mushroom.", "x": 1},
{"c": 1, "q": "Using the SAT, a still wine at 13.5% abv has what level of alcohol?", "o": ["Medium-plus", "High", "Low", "Medium"], "a": 3, "e": "Still wines: low is below 11%, medium is 11–13.9%, high is 14% and above.", "x": 1},
{"c": 1, "q": "A fortified wine at 19% abv would be described on the SAT as having:", "o": ["High alcohol", "Low alcohol", "No rating, because fortified wines aren't assessed for alcohol", "Medium alcohol"], "a": 0, "e": "Fortified wines have their own scale: low 15–16.4%, medium 16.5–18.4%, high 18.5% and above.", "x": 1},
{"c": 1, "q": "Which is the most reliable guide to the level of acidity in a wine?", "o": ["A hot, burning sensation", "How much, and how long, your mouth waters", "How sweet the wine tastes", "A drying, rough feeling on the gums"], "a": 1, "e": "Whatever the sugar level, acidity makes your mouth water. The more acid, the more and longer it waters.", "x": 1},
{"c": 1, "q": "Which of the following makes a wine feel lighter in body?", "o": ["High levels of ripe tannin", "Sugar", "High alcohol", "High acidity"], "a": 3, "e": "Alcohol is the main contributor to body and sugar adds to it. High acidity makes a wine feel lighter.", "x": 1},
{"c": 1, "q": "When judging the length of the finish, you should count:", "o": ["Only the warmth from alcohol", "Only the acidity", "Any sensation that lingers, including bitterness", "Only the desirable sensations, such as fruit"], "a": 3, "e": "Only count the pleasant sensations. If the fruit fades fast and acid or bitterness lingers, the finish is short.", "x": 1},
{"c": 1, "q": "A wine is well balanced, has intense, identifiable flavours and good complexity, but a short finish. Its quality level is:", "o": ["Good", "Outstanding", "Very good", "Acceptable"], "a": 2, "e": "Score it against balance, length, intensity and complexity. All four = outstanding, three = very good, two = good, one = acceptable, none = poor.", "x": 1},
{"c": 1, "q": "Which style of wine is given as an example where purity and definition, rather than complexity, make the wine great?", "o": ["Oloroso Sherry", "Vintage Port", "Barolo", "Icewine"], "a": 3, "e": "Not all premium wines are complex. For wines like Icewine, purity is the point and oak or tertiary notes might detract.", "x": 1},
{"c": 2, "q": "Which two components in food tend to make a wine taste 'harder' (more drying, bitter and acidic, less sweet and fruity)?", "o": ["Acid and chilli heat", "Fat and salt", "Salt and acid", "Sweetness and umami"], "a": 3, "e": "Sweetness and umami make wine harder. Salt and acid make it softer.", "x": 1},
{"c": 2, "q": "Which pair of foods is given as an example of umami?", "o": ["Honey and sugar", "Boiled rice and potatoes", "Miso and dried mushrooms", "Lemon and vinegar"], "a": 2, "e": "Umami examples: cooked or dried mushrooms, air-dried meats, aged cheeses and miso.", "x": 1},
{"c": 2, "q": "When pairing wine with a sweet dish, the general rule is to choose a wine that:", "o": ["Has high tannin", "Is drier than the dish", "Is sweeter than the dish", "Is low in alcohol"], "a": 2, "e": "Sweetness in food makes a dry wine seem less fruity and unpleasantly acidic, so the wine should be sweeter than the dish.", "x": 1},
{"c": 2, "q": "Which statement about food and wine interactions is true?", "o": ["Wine usually has more impact on food than the reverse", "Food usually has more impact on wine than the reverse, and the effect is more likely to be negative", "Food and wine always affect each other equally", "Food only affects red wines"], "a": 1, "e": "Generally food changes how a wine tastes more than wine changes the food, and that change is more likely to be negative.", "x": 1},
{"c": 2, "q": "High levels of acid in food can make which wine seem less fruity?", "o": ["A sweet wine", "A wine with very high acidity", "A high-alcohol wine", "A wine with low acidity"], "a": 3, "e": "Acidity in food is usually good: it balances a high-acid wine and enhances its fruit. But with a low-acid wine, acidic food can make it seem less fruity.", "x": 1},
{"c": 2, "q": "Salt in food affects a red wine by:", "o": ["Making the wine seem more acidic", "Making the tannin seem harsher", "Making the wine seem more bitter", "Softening the tannin and making the wine seem fruitier"], "a": 3, "e": "Salt is a wine-friendly component: it makes the wine seem fruitier and softens the tannin in red wines.", "x": 1},
{"c": 2, "q": "Why do many people enjoy acidic wines with fatty or oily foods?", "o": ["Fat removes all bitterness from tannins", "The acid seems to 'cut through' the fat and cleanse the palate", "Fat makes the wine taste sweeter", "Acid makes the food taste saltier"], "a": 1, "e": "The acidic wine seems to cut through the fattiness and cleanse the palate, though the effect is very subjective.", "x": 1},
{"c": 2, "q": "Why might a 'perfect pairing' for one person seem ordinary to another?", "o": ["The glassware is different", "People differ in their sensitivity to tastes and in their preferences", "Pairings only work with red wine", "Food and wine never interact"], "a": 1, "e": "Sensitivities (e.g. to bitterness) and preferences vary from person to person, so pairings should take the individual into account.", "x": 1},
{"c": 3, "q": "Why should a bottle sealed with a cork be stored on its side?", "o": ["To keep the wine cooler", "To keep the cork moist so it doesn't let air in", "To let the sediment collect in the neck", "Because screwcap and cork wines must be stored the same way"], "a": 1, "e": "Lying down keeps the cork in contact with the wine. A dried-out cork can let air in and make the wine taste stale and old.", "x": 1},
{"c": 3, "q": "At what temperature should a sparkling wine such as Champagne be served?", "o": ["Room temperature, 15–18°C (59–64°F)", "Well chilled, 6–10°C (43–50°F)", "Room temperature or lightly chilled, 13–18°C (55–64°F)", "Lightly chilled, 10–13°C (50–55°F)"], "a": 1, "e": "Sweet wines 6–8°C, sparkling 6–10°C (both well chilled); light whites and rosé 7–10°C; full whites 10–13°C; light reds 13–18°C; medium/full reds 15–18°C.", "x": 1},
{"c": 3, "q": "A light-bodied white wine such as Pinot Grigio should be served:", "o": ["Chilled, 7–10°C (45–50°F)", "Room temperature, 15–18°C (59–64°F)", "Lightly chilled, 10–13°C (50–55°F)", "Well chilled, 6–8°C (43–46°F)"], "a": 0, "e": "Light- and medium-bodied whites and rosés are served chilled at 7–10°C.", "x": 1},
{"c": 3, "q": "A light-bodied red such as Beaujolais should be served:", "o": ["Room temperature or lightly chilled, 13–18°C (55–64°F)", "Warmed to above 20°C (68°F)", "Well chilled, 6–10°C (43–50°F)", "Chilled, 7–10°C (45–50°F)"], "a": 0, "e": "Light-bodied reds can take a light chill (13–18°C), which shows off their fresh acidity and fruit.", "x": 1},
{"c": 3, "q": "When using an ice bucket to keep wine chilled, you should fill it with:", "o": ["Ice only", "Ice and a cloth over the bottle", "Cold water only", "Ice and cold water"], "a": 3, "e": "Fill the bucket with cold water as well as ice. Ice alone won't chill as efficiently.", "x": 1},
{"c": 3, "q": "A red wine is too cold to serve. What should you do?", "o": ["Decant it into a warmed jug", "Stand it in hot water", "Place it next to a radiator", "Leave it in the room where it will be served and let it warm naturally"], "a": 3, "e": "Don't heat a wine. Let it rise to temperature naturally in the room where it will be served.", "x": 1},
{"c": 3, "q": "How does a vacuum system keep an opened wine fresh?", "o": ["A pump removes the air from inside the bottle", "A gas is pumped in to push the air out", "The wine is frozen", "Carbon dioxide is added to the wine"], "a": 0, "e": "Vacuum systems pump air out. Blanket systems pump a harmless gas in to push the air out.", "x": 1},
{"c": 3, "q": "A wine whose closure has failed and let in oxygen is likely to show:", "o": ["Damp-cardboard aromas and muted fruit", "Pieces of cork floating in it", "A deeper, browner colour with honey, caramel or coffee aromas and little fresh fruit", "A pale colour and very fresh fruit"], "a": 2, "e": "An oxidised wine looks deeper and browner than it should, smells of honey, caramel or coffee, and lacks freshness and fruit.", "x": 1},
{"c": 3, "q": "A wine stored somewhere too hot, or under bright light, is likely to taste:", "o": ["More tannic", "Dull and stale, lacking its expected fruit", "Sweeter than expected", "Of damp cardboard"], "a": 1, "e": "Heat damage makes a wine lose freshness quickly, lack fruit and taste dull and stale.", "x": 1},
{"c": 3, "q": "When decanting a wine with a heavy deposit, when should you stop pouring?", "o": ["Only when the bottle is empty", "As soon as the cork is out", "When the deposit can be seen near the neck of the bottle", "When half the bottle has been poured"], "a": 2, "e": "Pour slowly in front of a light and stop when the deposit reaches the neck, so it stays in the bottle.", "x": 1},
{"c": 3, "q": "Which of the following should you check before serving a wine?", "o": ["1 and 2 only", "1, 2 and 3 only", "1, 2, 3 and 4", "3 and 4 only"], "a": 1, "e": "Check the appearance for haze, check for bits floating in the wine, and smell for faults such as wet cardboard or vinegar. Never heat a wine.", "x": 1, "s": ["The appearance, for any haziness", "That there are no bits floating in the wine", "The aroma, for faults such as wet cardboard or vinegar", "That it has been warmed next to a radiator"]},
{"c": 4, "q": "Which part of a grape contains the colour and most of the flavour?", "o": ["The stems", "The pulp", "The seeds", "The skin"], "a": 3, "e": "The skin and the area just under it hold lots of flavour, plus the colour and tannins, which are much higher in black grapes.", "x": 1},
{"c": 4, "q": "Why must grape seeds and stems be handled gently in winemaking?", "o": ["They contain the grape's colour", "They contain the yeast", "They hold most of the grape's sugar", "They contain high levels of tannin that can make wine taste bitter"], "a": 3, "e": "Seeds and stems are high in tannins that can make a wine very bitter if handled roughly.", "x": 1},
{"c": 4, "q": "A vine combines which two things, using sunlight, to make sugar?", "o": ["Nitrogen and water", "Oxygen and nutrients", "Alcohol and carbon dioxide", "Carbon dioxide and water"], "a": 3, "e": "Photosynthesis: the leaves take in carbon dioxide, the roots take up water, and sunlight lets the vine combine them into sugar.", "x": 1},
{"c": 4, "q": "How are vine flowers pollinated?", "o": ["They don't need pollinating", "By bees attracted to bright flowers", "By the wind", "By hand, by the grower"], "a": 2, "e": "Unlike many plants, vines rely on the wind to pollinate their flowers.", "x": 1},
{"c": 4, "q": "What are newly formed grapes like just after fruit set?", "o": ["Soft, sweet and golden", "Purple with high sugar", "Small, hard, dark green and unpleasant to taste", "Shrivelled and raisined"], "a": 2, "e": "All newly formed grapes are small, hard and dark green, whatever their eventual colour.", "x": 1},
{"c": 4, "q": "During ripening, how do the aromas of black grapes change?", "o": ["From cooked fruit to fresh fruit", "From stone fruit to tropical fruit", "From fresh fruit to cooked fruit", "From fruity to herbaceous"], "a": 2, "e": "As grapes ripen, herbaceous flavours fade. Some whites move from green to stone to tropical fruit; black grapes move from fresh to cooked fruit.", "x": 1},
{"c": 4, "q": "A moderate climate is defined as an average growing-season temperature of:", "o": ["Above 21°C (70°F)", "16.5°C (62°F) or below", "18.5–21°C (65–70°F)", "16.5–18.5°C (62–65°F)"], "a": 3, "e": "Cool is 16.5°C or below, moderate 16.5–18.5°C, warm 18.5–21°C.", "x": 1},
{"c": 4, "q": "In the southern hemisphere, the vine's growing season runs from:", "o": ["April to October", "January to June", "All year round", "October to April"], "a": 3, "e": "Northern hemisphere: April to October. Southern hemisphere: October to April.", "x": 1},
{"c": 4, "q": "What cools the climate of South Africa's Cape grape-growing regions?", "o": ["Cloud cover", "Ocean currents coming up from the South Pole", "Warm ocean currents from the Caribbean", "Morning fogs from rivers"], "a": 1, "e": "Seas moderate warm regions. The Cape is cooled by currents from the South Pole; northern Europe is warmed by currents from the Caribbean.", "x": 1},
{"c": 4, "q": "Fog is a very important moderating influence in the coastal regions of:", "o": ["Rioja and Ribera del Duero", "Mosel and Rheingau", "Burgundy and Beaujolais", "California and Chile"], "a": 3, "e": "Fog forms at ground level and cools vineyards. It matters most in coastal California and Chile.", "x": 1},
{"c": 4, "q": "Clouds can slow grape ripening because they:", "o": ["Raise the temperature", "Block sunlight, slowing photosynthesis", "Bring frost", "Cause botrytis"], "a": 1, "e": "Clouds block sunlight, so photosynthesis slows and grapes take longer to ripen. This matters in some warmer Australian regions.", "x": 1},
{"c": 4, "q": "In a vineyard far from the equator, which site will produce the ripest grapes?", "o": ["A low, shaded valley floor", "Flat land", "A slope facing the equator", "A slope facing away from the equator"], "a": 2, "e": "A slope facing the equator receives more heat and light than flat land or a slope facing away.", "x": 1},
{"c": 4, "q": "How can stones on the soil surface help grape ripening?", "o": ["They store more water", "They add nutrients", "They absorb heat and make the vineyard warmer", "They block cold winds"], "a": 2, "e": "Stones absorb heat and warm the vineyard, which helps ripening.", "x": 1},
{"c": 4, "q": "Heavy rain close to harvest can cause:", "o": ["Higher sugar levels", "Better tannin ripeness", "Grapes to raisin on the vine", "Grapes to swell, diluting their flavours"], "a": 3, "e": "High moisture helps fungal diseases spread, and heavy rain near harvest makes grapes swell and dilutes their flavour.", "x": 1},
{"c": 4, "q": "Why is frost a particular risk in spring?", "o": ["It can damage and kill the vine's new growth, reducing the crop", "It concentrates sugars in the grapes", "It splits ripe grapes at harvest", "It spreads fungal disease"], "a": 0, "e": "Spring frost can kill new shoots, which reduces how many grapes the vine can grow that year.", "x": 1},
{"c": 4, "q": "In a hot, dry vintage, why might a vine fail to ripen its grapes?", "o": ["The grapes freeze", "The acid levels rise too high", "Botrytis spreads", "Short of water, the vine shuts down to protect itself"], "a": 3, "e": "Heat increases the vine's need for water, but heat usually comes with little rain. Without water the vine shuts down and the grapes don't ripen. Grapes can also get dried-fruit aromas and sunburn.", "x": 1},
{"c": 4, "q": "Pesticides are used in the vineyard to:", "o": ["Kill weeds", "Keep birds away", "Kill fungi", "Kill insects"], "a": 3, "e": "Fungicides kill fungi, pesticides kill insects and herbicides control weeds.", "x": 1},
{"c": 4, "q": "Which statement about organic vineyards is true?", "o": ["Irrigation is banned", "They must be hand-harvested", "No sprays of any kind are allowed", "Grapes are grown without synthetic chemicals, though some sprays are permitted for the worst fungal diseases"], "a": 3, "e": "Organic means no synthetic chemicals, but some sprays are still allowed to control the worst fungal diseases.", "x": 1},
{"c": 4, "q": "If a vine's yield is too high, the grapes are likely to have:", "o": ["Diluted flavours and lower sugar levels", "More concentrated flavours", "Higher acidity and tannin", "More botrytis"], "a": 0, "e": "Too many grapes means diluted flavour and less sugar; too few and the crop isn't commercially viable.", "x": 1},

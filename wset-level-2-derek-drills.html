{"c": 4, "q": "Why can't machine harvesters be used in some vineyards?", "o": ["They only work at night", "They're banned in the EU", "They can't be used on steep slopes", "They can't pick grapes for quality wine"], "a": 2, "e": "Hand and machine harvesting are equally capable of quality. The choice depends on the style, but machines can't work steep slopes.", "x": 1},
{"c": 4, "q": "How do Geographical Indications (GIs) outside the EU differ from those inside it?", "o": ["Outside the EU they mainly show where grapes were grown, with few rules on grapes or winemaking", "Outside the EU they dictate the grape varieties allowed", "There is no difference", "Outside the EU they only cover single vineyards"], "a": 0, "e": "Inside the EU, GIs come with rules on grapes and winemaking, so they predict style. Outside, growers are free, so you need other clues like the grape variety.", "x": 1},
{"c": 4, "q": "Compared with PDOs, PGIs typically:", "o": ["Exist only in France", "Cover smaller areas with tighter rules", "Cover a wider area with less strict regulations", "Can only make inexpensive wine"], "a": 2, "e": "PDOs are typically small and tightly regulated. PGIs are larger and more flexible, from high-volume wines to outstanding premium ones.", "x": 1},
{"c": 4, "q": "Which is the Protected Geographical Indication (PGI) labelling term in Italy?", "o": ["Denominación de Origen Calificada (DOCa)", "Denominazione di Origine Controllata e Garantita (DOCG)", "Denominazione di Origine Controllata (DOC)", "Indicazione Geografica Tipica (IGT)"], "a": 3, "e": "Italy: DOC and DOCG are PDO; IGT is PGI.", "x": 1},
{"c": 4, "q": "Which of the following is a PDO labelling term in Spain?", "o": ["Denominación de Origen Calificada (DOCa)", "Indication géographique protégée (IGP)", "Landwein", "Vino de la Tierra"], "a": 0, "e": "Spain: DO and DOCa are PDO; Vino de la Tierra is PGI.", "x": 1},
{"c": 4, "q": "Which of the following are French PGI labelling terms?", "o": ["Indication géographique protégée (IGP) and Vin de pays (VdP)", "AOP and AOC", "IGT and Vino de la Tierra", "Qualitätswein and Landwein"], "a": 0, "e": "France: AOP and AOC are PDO; IGP and Vin de pays are PGI.", "x": 1},
{"c": 4, "q": "What does 'vieilles vignes' on a French label indicate?", "o": ["A grand cru vineyard", "Organic grapes", "Old vines, though the term is not legally defined", "Vines over 100 years old, by law"], "a": 2, "e": "Old vines give smaller crops of more concentrated grapes, so the term is prized. But it isn't legally defined, so its use can be disputed.", "x": 1},
{"c": 4, "q": "An Australian wine and a Californian wine are both labelled 2016. Which is true?", "o": ["The Californian wine is about half a year older", "The vintage refers to the bottling year", "They are exactly the same age", "The Australian wine is about half a year older"], "a": 3, "e": "The vintage is the harvest year. Southern-hemisphere grapes are harvested around half a year before northern ones in the same calendar year.", "x": 1},
{"c": 4, "q": "How is Icewine/Eiswein made?", "o": ["Grapes are frozen in the winery after picking", "Grapes are dried indoors after picking", "Grapes are affected by noble rot, then frozen", "Healthy grapes freeze on the vine, are picked frozen and pressed before they thaw"], "a": 3, "e": "Pressing frozen grapes leaves the ice behind, so the small amount of juice has highly concentrated sugar, acid and flavour.", "x": 1},
{"c": 5, "q": "During alcoholic fermentation, yeast convert sugar into:", "o": ["Tannin and alcohol", "Acid and carbon dioxide", "Alcohol and carbon dioxide, giving off heat", "Alcohol and oxygen"], "a": 2, "e": "Yeast feed on sugar and produce alcohol, carbon dioxide (which escapes) and heat.", "x": 1},
{"c": 5, "q": "Alcohol levels in most dry wines fall between:", "o": ["5% and 8% abv", "9% and 10.5% abv", "11.5% and 16% abv", "17% and 20% abv"], "a": 2, "e": "Fermentation usually stops when all the sugar is gone, giving a dry wine of 11.5–16% abv depending on how ripe the grapes were.", "x": 1},
{"c": 5, "q": "In red winemaking, what is the 'cap'?", "o": ["A thick layer of grape skins that floats on top of the fermenting juice", "The crown cap used for sparkling wine", "The layer of dead yeast at the bottom", "The lid of the fermentation tank"], "a": 0, "e": "The skins float up and form the cap. Left alone, no colour or tannin can be extracted from it, so it must be mixed back in.", "x": 1},
{"c": 5, "q": "In red winemaking, 'punching down' involves:", "o": ["Pressing the skins after fermentation", "Lowering the fermentation temperature", "Pumping juice from the bottom of the vessel over the cap", "Using a plunger to push the cap down into the liquid"], "a": 3, "e": "Punching down and pumping over are the two most common ways to mix skins with the fermenting liquid and extract colour and tannin.", "x": 1},
{"c": 5, "q": "How is a rosé made by short maceration?", "o": ["White grapes are left on their skins for several weeks", "Black grapes start fermenting on their skins, are drained after a few hours, and fermentation continues at white-wine temperatures", "Black grapes are pressed very gently and never touch the skins", "Red wine and white wine are blended"], "a": 1, "e": "Short maceration starts like red winemaking, but the juice comes off the skins after a few hours and finishes fermenting cool, like a white.", "x": 1},
{"c": 5, "q": "Which method of making rosé is not permitted in many parts of Europe?", "o": ["Using black grapes", "Blending red wine with white wine", "Short maceration", "Fermenting in stainless steel"], "a": 1, "e": "A rosé can be made by blending red and white wine, but that isn't allowed in many parts of Europe.", "x": 1},
{"c": 5, "q": "Can white wine be made from black grapes?", "o": ["Only if colour is removed with filters", "No, black grapes always make red or rosé", "Yes, if the grapes are pressed very gently, because colour is only in the skins", "Only for sweet wines"], "a": 2, "e": "With very few exceptions, the pulp of black grapes is pale, so gentle pressing gives white juice.", "x": 1},
{"c": 5, "q": "Fortification kills the yeast by raising the alcohol to around:", "o": ["15–20% abv", "8–10% abv", "11.5–13% abv", "25–30% abv"], "a": 0, "e": "Adding alcohol to fermenting juice lifts it to 15–20% abv, which kills the yeast before all the sugar is fermented. Port is made this way.", "x": 1},
{"c": 5, "q": "Which sweet-winemaking technique lets the winemaker control the level of sweetness most precisely?", "o": ["Using botrytis-affected grapes", "Using frozen grapes", "Adding sweetness to a dry wine", "Removing the yeast with filters"], "a": 2, "e": "Adding unfermented or concentrated grape juice, or blending in a sweet wine, lets the winemaker dial in exactly the sweetness they want.", "x": 1},
{"c": 5, "q": "In a cool vintage, the grapes have too little sugar. What can the winemaker do?", "o": ["Ferment at a lower temperature", "Add sugar to the grape juice, which raises the alcohol", "Neutralise some sugar", "Add acid"], "a": 1, "e": "Low-sugar grapes make wines low in alcohol and body. Adding sugar to the juice gives more alcohol. In warm climates, winemakers add acid; in cool climates they may also neutralise excess acid.", "x": 1},
{"c": 5, "q": "Fermenting a white wine at the lower end of the 12–22°C range tends to:", "o": ["Create buttery aromas", "Add oak flavours", "Extract more tannin", "Produce notable fruity aromas"], "a": 3, "e": "At the cooler end of the white-wine range, fermentations can produce notably fruity aromas.", "x": 1},
{"c": 5, "q": "Which statement about stainless steel and concrete vessels is true?", "o": ["They add vanilla and smoke", "They allow oxygen to interact with the wine", "They can only be used for fermentation", "They are inert, add no flavour and can be made airtight"], "a": 3, "e": "Inert vessels add no flavour and can keep oxygen out, so the wine's flavours don't change.", "x": 1},
{"c": 5, "q": "The level of 'toasting' of an oak barrel can produce:", "o": ["Sweet-spice and charred-wood aromas", "Butter and cream", "Bread and biscuit", "Honey and petrol"], "a": 0, "e": "Staves are heated to bend them. How long and how hot affects the oak flavours: toasting gives sweet spice and charred wood.", "x": 1},
{"c": 5, "q": "After how many uses does an oak barrel have very little flavour left to give?", "o": ["Barrels never lose their flavour", "One", "Two or three", "Ten"], "a": 2, "e": "New-oak barrels give the most flavour (vanilla, coconut, charred wood, spice). Each use gives less, and after two or three there's very little left.", "x": 1},
{"c": 5, "q": "Oxygen entering an oak barrel during maturation can:", "o": ["1 and 2 only", "1 and 3 only", "1, 2 and 3", "2 and 3 only"], "a": 0, "e": "Oak is watertight but not airtight. Oxygen develops caramel, dried-fruit and nut flavours and softens red-wine tannins, faster in small barrels than large vessels.", "x": 1, "s": ["Develop flavours of caramel, dried fruit and nuts", "Soften the tannins in red wine", "Add buttery flavours"]},
{"c": 5, "q": "The interaction between wine and oxygen in oak happens more quickly in:", "o": ["Large oak vessels", "Small barrels", "Stainless steel tanks", "Concrete vessels"], "a": 1, "e": "More of the wine's surface touches the wood in a small barrel. Large oak vessels are rarely used to add oak flavour.", "x": 1},
{"c": 5, "q": "Why might a winemaker use oak chips or staves instead of barrels?", "o": ["They are a much cheaper way to give oak flavour to less expensive wines", "They are required by law for premium wines", "They allow more oxygen into the wine", "They add buttery flavours"], "a": 0, "e": "Barrels are expensive. Chips or staves added to wine in an inert vessel give oak flavour at much lower cost.", "x": 1},
{"c": 5, "q": "Malolactic conversion is carried out by:", "o": ["Oxygen", "Bacteria", "Oak", "Yeast"], "a": 1, "e": "Malolactic conversion happens after alcoholic fermentation. Bacteria lower the acidity and can give buttery flavours. It nearly always happens in reds.", "x": 1},
{"c": 5, "q": "Winemakers often prevent malolactic conversion and avoid lees stirring when making wine from which type of grape?", "o": ["Chardonnay", "Black grapes for red wine", "Grapes for oaked wines", "Aromatic varieties such as Riesling"], "a": 3, "e": "Malo lowers acidity and adds butter; lees add bread and biscuit. Both are usually avoided for aromatic varieties to keep their acidity and aromas pure.", "x": 1},
{"c": 5, "q": "Why do winemakers blend wines?", "o": ["1 and 2 only", "1 only", "1, 2 and 3", "2 and 3 only"], "a": 0, "e": "Blending keeps a brand tasting the same year after year and can create a wine more complex than its parts.", "x": 1, "s": ["To keep a brand's style consistent from year to year", "To create a more complex wine", "To raise the alcohol level"]},
{"c": 5, "q": "As a white wine matures in bottle, its colour typically:", "o": ["Moves from gold to lemon and becomes paler", "Turns ruby", "Moves from lemon to gold to amber and becomes deeper", "Stays the same"], "a": 2, "e": "Whites deepen with age, lemon → gold → amber, and develop dried apricot, honey, nut and spice.", "x": 1},
{"c": 5, "q": "As a red wine matures in bottle, its colour typically:", "o": ["Turns gold", "Moves from garnet to ruby and becomes deeper", "Moves from ruby to garnet to tawny and becomes paler", "Moves from purple to ruby and becomes deeper"], "a": 2, "e": "Reds lighten with age, ruby → garnet → tawny. Tannins drop and soften, and deposits can form.", "x": 1},
{"c": 5, "q": "Which tertiary characteristics can develop in a red wine aged in bottle?", "o": ["Butter and cream", "Vanilla, smoke and coconut", "Apple, lemon and grass", "Fig, prune, meat and wet leaves"], "a": 3, "e": "Bottle-aged reds develop fig, prune, meat and wet leaves; whites develop dried apricot, honey, nut and spice.", "x": 1},
{"c": 5, "q": "Which statement about maturation in the bottle is true?", "o": ["Most wines do not improve in bottle; their fruit fades", "All wines improve with at least five years in bottle", "Sweet wines can never age", "Only low-acid wines improve in bottle"], "a": 0, "e": "Most wines don't improve. The few that do need concentrated flavour plus high acidity, high sugar (sweet wines) or high tannin (reds).", "x": 1},
{"c": 6, "q": "Which statement about Pinot Noir in the vineyard is true?", "o": ["It is thin-skinned and prone to rot and disease", "It needs a warm climate", "It is thick-skinned and disease-resistant", "It is easy to grow in any vintage"], "a": 0, "e": "Pinot Noir is thin-skinned, prone to rot and disease, and not easy to grow. It needs a cool to moderate climate.", "x": 1},
{"c": 6, "q": "Which best describes a typical Pinot Noir?", "o": ["Deep · Medium · High", "Pale · Low · High", "Pale to medium · High · Low to medium", "Deep · Low · Medium to high"], "a": 2, "e": "Pale to medium colour, high acidity, low to medium tannin, red fruit (strawberry, raspberry, red cherry).", "x": 1, "h": ["Colour", "Acidity", "Tannin"]},
{"c": 6, "q": "Why are older and/or larger barrels often used for Pinot Noir?", "o": ["They add more tannin", "Strong flavours from small new-oak barrels can overwhelm its delicate fruit", "They give stronger vanilla flavours", "Pinot Noir is never oaked"], "a": 1, "e": "Older or larger barrels add less flavour. The best Pinot Noirs show subtle oak (smoke, cloves) balanced by fruit.", "x": 1},
{"c": 6, "q": "What tertiary flavours can very good or outstanding Pinot Noir develop in bottle?", "o": ["Petrol and honey", "Forest floor and mushroom", "Leather and coffee", "Butter and cream"], "a": 1, "e": "Fine Pinot Noir gains forest floor and mushroom with bottle age and may take several years to show its best.", "x": 1},
{"c": 6, "q": "The Côte d'Or in Burgundy is split into two halves. Which is the northern half?", "o": ["Chablis", "Côte de Beaune", "Mâconnais", "Côte de Nuits"], "a": 3, "e": "Côte de Nuits is north (Gevrey-Chambertin, Nuits-Saint-Georges); Côte de Beaune is south (Beaune, Pommard).", "x": 1},
{"c": 6, "q": "Which of these Pinot Noir villages is in the Côte de Beaune?", "o": ["Pommard AOC", "Gevrey-Chambertin AOC", "Pouilly-Fuissé AOC", "Nuits-Saint-Georges AOC"], "a": 0, "e": "Côte de Beaune: Beaune and Pommard. Côte de Nuits: Gevrey-Chambertin and Nuits-Saint-Georges.", "x": 1},
{"c": 6, "q": "What is the order of the Burgundy hierarchy, from lowest to highest?", "o": ["Bourgogne AOC, premier cru, village, grand cru", "Bourgogne AOC, village, premier cru, grand cru", "Village, Bourgogne AOC, grand cru, premier cru", "Grand cru, premier cru, village, Bourgogne AOC"], "a": 1, "e": "Regional (Bourgogne AOC) → village → premier cru vineyards → grand cru vineyards.", "x": 1},
{"c": 6, "q": "A typical red Bourgogne AOC is best described as:", "o": ["Inexpensive because Burgundy has no demand", "Sweet and low in alcohol", "Full-bodied with cooked black fruit and long ageing potential", "Light to medium body, low tannin, high acidity, fresh red fruit, for drinking young"], "a": 3, "e": "Bourgogne AOC lacks the flavour intensity to age. Due to demand, even basic Bourgogne can be expensive.", "x": 1},
{"c": 6, "q": "What cools Pinot Noir vineyards in Carneros, California?", "o": ["Cooling breezes from the Southern Ocean", "Morning fogs from San Pablo Bay", "Pacific Ocean breezes", "Altitude"], "a": 1, "e": "Carneros: San Pablo Bay fog. Western Sonoma: Pacific breezes. Santa Barbara County: sea breezes from the west and south.", "x": 1},
{"c": 6, "q": "Which New Zealand region produces the country's ripest and most powerfully flavoured Pinot Noir?", "o": ["Central Otago", "Hawke's Bay", "Marlborough", "Martinborough"], "a": 0, "e": "Despite its southerly latitude, Central Otago is ringed by mountains that block sea breezes and rain, giving intensely sunny days and cool nights.", "x": 1},
{"c": 6, "q": "Besides the Yarra Valley, which Australian region is cool enough for Pinot Noir thanks to Southern Ocean breezes?", "o": ["Clare Valley", "Barossa Valley", "Mornington Peninsula", "Hunter Valley"], "a": 2, "e": "Yarra Valley and Mornington Peninsula in Victoria are among the few Australian regions cool enough for Pinot Noir.", "x": 1},
{"c": 6, "q": "Compared with California, Oregon's climate is generally:", "o": ["Warmer and drier", "Cooler, and mostly moderate, which is ideal for Pinot Noir", "Hot and continental", "Too cold for Pinot Noir"], "a": 1, "e": "Oregon's best Pinot Noirs have fresh red fruit, subtle oak (smoke, cloves) and develop earth and mushroom with age.", "x": 1},
{"c": 7, "q": "As Zinfandel/Primitivo grapes ripen, their flavours change from:", "o": ["Black fruits to red fruits", "Green fruit to tropical fruit", "Red fruits to black fruits", "Citrus to stone fruit"], "a": 2, "e": "Zinfandel moves from strawberry and raspberry to plum and black cherry as it ripens.", "x": 1},
{"c": 7, "q": "Some Zinfandel grapes in a bunch start to raisin before others have ripened. What does this give the wine?", "o": ["High sugar levels and dried-fruit flavours", "Botrytis character", "Low alcohol", "High acidity and green flavours"], "a": 0, "e": "Uneven ripening gives high sugar and flavours of prune and raisin.", "x": 1},
{"c": 7, "q": "White Zinfandel typically has what level of alcohol?", "o": ["High, 15% abv and above", "Low, typically 8–10% abv", "Medium, 12–13% abv", "Fortified, 17% abv"], "a": 1, "e": "White Zinfandel is usually made by short maceration, and removing the yeasts before fermentation finishes leaves medium sweetness and only 8–10% abv.", "x": 1},
{"c": 7, "q": "Which best describes a typical Californian red Zinfandel?", "o": ["Medium · High · Low", "Low · Low · Low", "High · Low · Medium", "Medium to high · Medium to high · High"], "a": 3, "e": "Dry, medium to high acidity and tannin, high alcohol and full body, with black fruit, dried fruit and oak.", "x": 1, "h": ["Acidity", "Tannin", "Alcohol"]},
{"c": 7, "q": "Puglia's Primitivo is an important source of:", "o": ["Soft, fruity, dry red wine for high-volume brands", "Medium-sweet rosé", "Traditional-method sparkling wine", "Sweet fortified wine"], "a": 0, "e": "Warm Puglia makes lots of soft, fruity, dry reds. From controlled yields, top Primitivos can be very good or outstanding and great value.", "x": 1},
{"c": 8, "q": "Extra-ripe Riesling grapes give flavours of:", "o": ["Grass and green bell pepper", "Stone fruit and tropical fruit", "Apple, lemon and lime", "Blackcurrant and mint"], "a": 1, "e": "Just-ripe: green fruit and citrus. Extra-ripe: peach, apricot, mango, pineapple, and sometimes dried fruit.", "x": 1},
{"c": 8, "q": "Off-dry or medium Riesling can be made by adding Süssreserve. What is it?", "o": ["Grape spirit", "Botrytis-affected grapes", "Sugar from beet", "Sterile grape juice"], "a": 3, "e": "Off-dry and medium Rieslings are made by removing yeast to stop fermentation, or by adding sterile grape juice (Süssreserve).", "x": 1},
{"c": 8, "q": "Why is Riesling typically fermented in stainless steel?", "o": ["To add vanilla and toast", "To preserve its floral aromas", "To soften tannins", "To add body"], "a": 1, "e": "Inert vessels keep Riesling's floral, fruity aromas pure.", "x": 1},
{"c": 8, "q": "Compared with Mosel Rieslings, Rheingau Rieslings are typically:", "o": ["Sweeter and lighter", "Made from botrytised grapes only", "Drier in style with more body", "Always sparkling"], "a": 2, "e": "Rheingau vineyards are on steep south-facing slopes on the north bank of the Rhine. The wines are drier and fuller than Mosel's.", "x": 1},

{"c": 15, "q": "In New Zealand's Hawke's Bay, Cabernet Sauvignon:", "o": ["Ripens easily everywhere", "Needs the warmest sites to fully ripen and is commonly blended with Merlot", "Is the most widely planted grape", "Is used mainly for sparkling wine"], "a": 1, "e": "The blends show fresh red and black fruit with green bell pepper.", "x": 1},
{"c": 16, "q": "Which describes the Syrah/Shiraz grape?", "o": ["A white grape", "Thin-skinned with large grapes", "Thick-skinned with small grapes", "Needs a cool climate"], "a": 2, "e": "Syrah's thick skins and small grapes give medium to high tannin and acidity.", "x": 1},
{"c": 16, "q": "A typical moderate-climate Syrah, such as from the Northern Rhône, is:", "o": ["High in acidity with red cherry and dried herbs", "Medium-bodied with fresh black fruit, herbal notes and black pepper", "Light with strawberry and white pepper", "Full-bodied with cooked black fruit and liquorice"], "a": 1, "e": "Moderate Syrah: medium body, fresh black cherry and blackberry, herbs, pepper. Warm Shiraz: full body, high alcohol, cooked black fruit, liquorice.", "x": 1},
{"c": 16, "q": "Outside France and Australia, what can the choice of 'Syrah' or 'Shiraz' on a label suggest?", "o": ["The style: Syrah suggests the fresher moderate style, Shiraz the riper warm style", "The colour of the wine", "Nothing: the names are random", "Whether the wine is sweet"], "a": 0, "e": "Producers elsewhere use the name to signal which style they made.", "x": 1},
{"c": 16, "q": "What tradition is followed by some producers in Côte-Rôtie?", "o": ["Using the appassimento method", "Blending Syrah with Grenache", "Co-fermenting a small amount of Viognier with the Syrah, adding floral aromas", "Making the wine sparkling"], "a": 2, "e": "Côte-Rôtie is the northern limit of where Syrah ripens. Its steep, stony slopes give complex, peppery wines.", "x": 1},
{"c": 16, "q": "How does Crozes-Hermitage AOC compare with Hermitage AOC?", "o": ["Smaller and steeper, with more intense wines", "It is in the Southern Rhône", "It makes white wine only", "Larger and flatter, with less intense wines at lower prices"], "a": 3, "e": "Hermitage is one steep south-facing hill. The flatter Crozes-Hermitage around it has higher yields and can be mechanised, so prices are lower.", "x": 1},
{"c": 16, "q": "What is the most widely planted grape variety in Australia?", "o": ["Shiraz", "Cabernet Sauvignon", "Chardonnay", "Grenache"], "a": 0, "e": "Shiraz is Australia's most widely planted variety; much grows in warm inland regions for inexpensive wines labelled South Eastern Australia.", "x": 1},
{"c": 16, "q": "A typical Hunter Valley Shiraz is:", "o": ["Sweet and fortified", "Medium-bodied with medium to high tannins and fresh black fruit, developing earth and meat with age", "Light-bodied and pale", "Full-bodied with cooked black fruit and very high alcohol"], "a": 1, "e": "Hunter Valley is warm, but summer cloud cover and sea breezes slow ripening, giving a fresher style.", "x": 1},
{"c": 16, "q": "Syrah is the only black grape variety permitted in the AOC wines of:", "o": ["The Northern Rhône", "Minervois", "The Southern Rhône", "Bordeaux"], "a": 0, "e": "In the Northern Rhône, Syrah stands alone among black grapes, grown on steep slopes along the narrow river valley.", "x": 1},
{"c": 16, "q": "What tertiary flavours develop in very good Syrah/Shiraz with bottle age?", "o": ["Dried fruit, leather, meat and earth", "Banana and candy", "Hazelnut and mushroom", "Petrol and honey"], "a": 0, "e": "The finest examples can age a decade or more, gaining dried fruit, leather, meat and earth.", "x": 1},
{"c": 16, "q": "Where in the South of France might you find a single-varietal Syrah?", "o": ["Labelled Chablis AOC", "Labelled Pays d'Oc IGP", "Labelled Pomerol AOC", "Labelled Hermitage AOC"], "a": 1, "e": "Syrah ripens reliably in the warm South of France. It's blended into appellations like Minervois AOC or bottled alone as Pays d'Oc IGP.", "x": 1},
{"c": 17, "q": "Some Beaujolais winemaking techniques maximise colour and minimise tannin. What aromas can they create?", "o": ["Vanilla and smoke", "Bread and biscuit", "Black pepper and liquorice", "Banana and candy"], "a": 3, "e": "These techniques give the classic banana and candy notes of light, fruity Beaujolais.", "x": 1},
{"c": 17, "q": "Where is Beaujolais, and what is its climate?", "o": ["Directly south of Burgundy, with a moderate climate", "In the Loire, with a cool climate", "North of Champagne, with a cool climate", "In the Southern Rhône, with a warm climate"], "a": 0, "e": "Beaujolais lies just south of Burgundy and has a moderate climate.", "x": 1},
{"c": 17, "q": "How many Beaujolais crus are there?", "o": ["One, Fleurie", "Ten", "Three", "Twenty"], "a": 1, "e": "Ten villages within the Beaujolais Villages area have their own appellations. Fleurie is one of the best known.", "x": 1},
{"c": 17, "q": "Why do Beaujolais Villages AOC wines typically have more flavour intensity and body than Beaujolais AOC?", "o": ["Their vineyards in the north have less fertile, stonier soils that control yields", "They are made from a different grape", "They come from the flat, fertile south", "They are aged in new oak"], "a": 0, "e": "Basic Beaujolais AOC grapes come mostly from the flat, fertile south with high yields. The Villages are in the north, on poorer soils.", "x": 1},
{"c": 17, "q": "Which statement about Gamay winemaking is true?", "o": ["It is usually blended with Cabernet Sauvignon", "It is always aged in new oak for two years", "It is usually fortified", "It is usually made in inert vessels and rarely shows oak"], "a": 3, "e": "Gamay wines are usually made in inert vessels. Most are for early drinking and lose their fresh fruit quickly in bottle.", "x": 1},
{"c": 18, "q": "What do Syrah (in France) and Tempranillo (in Spain) add when blended with Grenache?", "o": ["Bubbles", "Colour, acidity and tannins", "Red-fruit flavours", "Sugar and alcohol"], "a": 1, "e": "Grenache is high in sugar, low in acid and thin-skinned. Partners fill in colour, acidity and tannin.", "x": 1},
{"c": 18, "q": "How do the large, round stones in Châteauneuf-du-Pape vineyards help Grenache?", "o": ["They keep the vines cool", "They absorb heat by day and radiate it back to the vines at night", "They protect the vines from hail", "They hold water in the soil"], "a": 1, "e": "The stones help Grenache reach full ripeness. Châteauneuf-du-Pape is known for full-bodied, high-alcohol wines.", "x": 1},
{"c": 18, "q": "Compared with Côtes du Rhône AOC, wines labelled Côtes du Rhône Villages AOC typically offer:", "o": ["More flavour intensity and complexity", "Sparkle", "Less concentration", "Sweetness"], "a": 0, "e": "Côtes du Rhône → Côtes du Rhône Villages → Rhône crus, with intensity and complexity rising up the ladder.", "x": 1},
{"c": 18, "q": "Besides Rioja, which Spanish region is known for dry Garnacha rosé?", "o": ["Rías Baixas DO", "Navarra DO", "Ribera del Duero DO", "Priorat DOCa"], "a": 1, "e": "Garnacha adds body and red fruit in Rioja and neighbouring Navarra, which is also known for dry rosé.", "x": 1},
{"c": 18, "q": "Why do some producers prefer old oak over new oak for Grenache?", "o": ["Grenache's red-fruit flavours are delicate", "Old oak adds more vanilla", "Grenache has too much tannin", "New oak is banned in the Rhône"], "a": 0, "e": "Many simple Grenaches are unoaked; very good ones are often barrel-matured, sometimes in old oak to protect the delicate fruit.", "x": 1},
{"c": 18, "q": "Which of these is a Rhône cru in the Northern Rhône?", "o": ["Minervois AOC", "Côte Rôtie AOC", "Châteauneuf-du-Pape AOC", "Côtes du Rhône Villages AOC"], "a": 1, "e": "Northern Rhône crus include Crozes-Hermitage, Hermitage, Côte Rôtie and Condrieu. Châteauneuf-du-Pape is in the south.", "x": 1},
{"c": 19, "q": "How are Tempranillo-based wines traditionally matured in many parts of Spain?", "o": ["Under flor", "In small new-oak barrels, giving vanilla, smoke and cedar", "In stainless steel only", "By drying the grapes first"], "a": 1, "e": "New oak adds vanilla, smoke and cedar, softens tannins and adds body. The best wines often also age in bottle before release.", "x": 1},
{"c": 19, "q": "What must happen to a Crianza wine before release?", "o": ["It must have the longest ageing of all", "Nothing: it has no minimum ageing", "It must age only in bottle", "It must be aged in oak barrels, gaining secondary oak flavours"], "a": 3, "e": "Joven has no minimum ageing. Crianza must age in oak. Reserva ages in oak and bottle. Gran Reserva has the highest minimums.", "x": 1},
{"c": 19, "q": "Which statement about Joven wines is true?", "o": ["They must be aged in oak for two years", "They are only made in Rioja", "They have no minimum ageing and are typically released the year after the vintage", "They have the most tertiary aromas"], "a": 2, "e": "Joven means young: fruity wines with primary flavours from the grapes.", "x": 1},
{"c": 19, "q": "What allows Tempranillo in Ribera del Duero to make very full-bodied wines with fresh black fruit?", "o": ["Warm days and cool nights in this mountainous inland region", "Very high yields", "Cooling Atlantic fog", "Botrytis"], "a": 0, "e": "Ribera del Duero is inland and mountainous. Warm days ripen the grapes; cool nights keep the fruit fresh.", "x": 1},
{"c": 19, "q": "Which statement about the terms Crianza, Reserva and Gran Reserva is true?", "o": ["They refer to vineyard altitude", "They are PGI terms", "They are national Spanish labelling terms, not specific to Rioja", "They can only be used in Rioja"], "a": 2, "e": "These ageing terms apply throughout Spain; some regions have stricter laws and many producers exceed the minimums.", "x": 1},
{"c": 19, "q": "Why might a producer choose not to make a Gran Reserva in a particular vintage?", "o": ["The vintage was too good", "The law forbids it in hot years", "The grapes lacked the flavour intensity, acidity and tannin needed for long ageing", "Gran Reserva can only be made every ten years"], "a": 2, "e": "Putting an inferior wine through long ageing gives a stale wine lacking fruit, so only wines with enough intensity, acidity and tannin qualify.", "x": 1},
{"c": 19, "q": "Which statement about Rioja DOCa is true?", "o": ["It has a moderate climate and is usually a blend, with Tempranillo dominating the best wines", "It is a hot region in southern Spain", "It is in north-west Spain beside the Atlantic", "It is always 100% Garnacha"], "a": 0, "e": "Rioja, in north-east Spain, blends Tempranillo with Garnacha for early-drinking wines and with other local grapes for colour, tannin and acidity in long-ageing wines.", "x": 1},
{"c": 20, "q": "Why can Carmenère struggle to ripen, even in Chile?", "o": ["It is too sensitive to cold winters", "It is very prone to botrytis", "It needs a long, sunny growing season, so it only ripens in the warmest, sunniest sites", "It needs a cool climate"], "a": 2, "e": "Carmenère can struggle to ripen in all but the warmest, sunniest sites of the Central Valley.", "x": 1},
{"c": 20, "q": "When fully ripe, Carmenère gives flavours of:", "o": ["Strawberry and white pepper", "Lychee and rose", "Fresh blackberry and eucalyptus", "Green bell pepper and tomato leaf"], "a": 2, "e": "Ripe Carmenère: fresh black fruit and herbal eucalyptus. Unripe: pungent green bell pepper and tomato leaf.", "x": 1},
{"c": 20, "q": "Where is Malbec native to?", "o": ["Spain", "Argentina", "South-west France", "Italy"], "a": 2, "e": "Like Carmenère, Malbec comes from south-west France but has adapted well to South America's warmer climate.", "x": 1},
{"c": 20, "q": "Maturation in new oak gives Malbec flavours of:", "o": ["Butter and cream", "Coffee and chocolate", "Clove and vanilla", "Bread and biscuit"], "a": 2, "e": "New oak softens Malbec and adds spicy clove and vanilla. Very good examples age into dried fruit and meat.", "x": 1},
{"c": 20, "q": "Which statement about Pinotage is true?", "o": ["It was developed specially for South Africa and is closely related to Pinot Noir", "It is a white grape", "It is grown mainly in Argentina", "It is native to Bordeaux"], "a": 0, "e": "Pinotage was made for South Africa's warm, dry climate. It shares Pinot Noir's red fruit, with medium tannin and high acidity.", "x": 1},
{"c": 20, "q": "Pinotage made in contact with oak can take on pronounced aromas of:", "o": ["Petrol and honey", "Clove and vanilla", "Coffee, chocolate and smoke", "Lemon and wet stones"], "a": 2, "e": "Pinotage ranges from fruity medium-bodied wines to powerful full-bodied ones, and picks up coffee, chocolate and smoke from oak.", "x": 1},
{"c": 20, "q": "Most of Argentina's Malbec is planted in:", "o": ["The coastal Casablanca Valley", "The low, flat Central Valley", "Stellenbosch", "The high-altitude region of Mendoza"], "a": 3, "e": "Malbec is grown widely in Argentina, but the majority is in high-altitude Mendoza.", "x": 1},
{"c": 21, "q": "Which best describes a wine made from Cortese?", "o": ["Dry, full-bodied, medium acidity, peach, melon and mango", "Dry, light-bodied, high acidity, blossom, apple, pear and lemon", "Sweet, light-bodied, grape and peach", "Dry, medium-bodied, high acidity, fennel"], "a": 1, "e": "Cortese, the grape of Gavi DOCG in Piemonte, is fermented in inert vessels and not oaked.", "x": 1},

{"c": 21, "q": "The best Soave Classico DOC wines can develop which flavours in bottle?", "o": ["Butter and vanilla", "Petrol and lime", "Leather and tobacco", "Honey and almonds"], "a": 3, "e": "Most Soave DOC is for drinking young, but the best Soave Classico gains honey and almonds.", "x": 1},
{"c": 21, "q": "Which herbal note is characteristic of Verdicchio?", "o": ["Fennel", "Mint", "Eucalyptus", "Dried herbs"], "a": 0, "e": "Verdicchio: dry, high acidity, medium body, apple, pear, lemon and fennel.", "x": 1},

{"c": 21, "q": "Fiano di Avellino DOCG comes from which region?", "o": ["Tuscany", "Piemonte", "Campania", "Veneto"], "a": 2, "e": "Fiano is an important white grape in southern Italy. Fiano di Avellino comes from mountainous Campania.", "x": 1},
{"c": 21, "q": "Some Fiano wines show secondary aromas of bread and biscuit. Where do these come from?", "o": ["Lees contact", "Bottle age", "Malolactic conversion", "Botrytis"], "a": 0, "e": "Many producers ferment Fiano in inert vessels, but some show lees (bread, biscuit) or oak (smoke).", "x": 1},
{"c": 22, "q": "What tertiary aromas do the best Nebbiolo wines develop with bottle age?", "o": ["Hazelnut and butter", "Petrol and honey", "Banana and candy", "Mushroom, tobacco and leather"], "a": 3, "e": "Nebbiolo's high acid and tannin let its wines improve with age, gaining mushroom, tobacco and leather.", "x": 1},
{"c": 22, "q": "What is the landscape of the Barolo region?", "o": ["A horseshoe-shaped valley with steep south-facing vineyards", "A flat, fertile plain", "Coastal vineyards cooled by fog", "A narrow river valley with the Rhône below"], "a": 0, "e": "Barolo DOCG is 100% Nebbiolo, typically full-bodied with pronounced flavours, high tannin and acidity, and long ageing potential.", "x": 1},

{"c": 22, "q": "Which best describes Amarone della Valpolicella DOCG?", "o": ["Sparkling and dry", "Sweet, light and low in alcohol", "Light-bodied, fruity and simple", "Dry to off-dry, full-bodied, about 15% abv, high tannins, red cherry plus prune, raisin and fig"], "a": 3, "e": "Amarone is made from partially dried grapes (appassimento), which concentrate sugar, acid, tannin and flavour.", "x": 1},

{"c": 22, "q": "How does the appassimento method work?", "o": ["Grapes are picked and dried indoors to concentrate sugars, acids, tannins and flavours", "Grape spirit is added during fermentation", "Grapes are left to freeze on the vine", "Grapes are affected by noble rot"], "a": 0, "e": "Appassimento is widely used in the Veneto for Amarone and Recioto della Valpolicella, and Recioto di Soave.", "x": 1},

{"c": 23, "q": "How does Chianti Classico DOCG differ from the wider Chianti DOCG?", "o": ["It must be sweet", "It is always simple and inexpensive", "It is made from Montepulciano", "It sits at higher altitude, with a long ripening season and more pronounced red fruit and dried herbs"], "a": 3, "e": "Many Chianti DOCG wines are simple. Chianti Classico is often oak-matured (cloves, cedar) and the best gain meat and leather with age.", "x": 1},

{"c": 23, "q": "In Brunello di Montalcino, what is 'Brunello'?", "o": ["A separate grape variety", "A Riserva ageing term", "The name of a type of barrel", "The local name for Sangiovese"], "a": 3, "e": "Brunello di Montalcino comes from the warm, sunny town of Montalcino in southern Tuscany and must age in oak for an extended period before release.", "x": 1},
{"c": 23, "q": "Which best describes a wine made from Montepulciano?", "o": ["Medium · Medium · Medium · Strawberry", "Pale · High · Low · Red cherry", "Deep · High · High · Red cherry, dried herbs", "Deep · Medium · High · Black plum, black cherry"], "a": 3, "e": "Montepulciano: deeply coloured, medium acidity, high tannin and black fruit. Sangiovese: high acidity, high tannin and red fruit.", "x": 1, "h": ["Colour", "Acidity", "Tannin", "Fruit"]},
{"c": 23, "q": "Which mountains divide Tuscany, where Sangiovese dominates, from Abruzzo, where Montepulciano is widely planted?", "o": ["The Apennines", "The Alps", "The Vosges", "The Andes"], "a": 0, "e": "The Apennines run down Italy's spine. Tuscany lies west, Abruzzo east.", "x": 1},
{"c": 23, "q": "Barbera d'Asti DOCG is named after:", "o": ["A grape variety only", "A producer", "A region only", "A grape variety and a region"], "a": 3, "e": "Italian wines are named after a region (Barolo, Valpolicella) or a grape plus a region (Barbera d'Asti = 'Barbera from Asti').", "x": 1},
{"c": 23, "q": "Chianti Classico Riserva DOCG differs from Chianti Classico DOCG because it:", "o": ["Comes from a different region", "Has stricter ageing requirements and may show tertiary characters on release", "Is sweet", "Is made from Montepulciano"], "a": 1, "e": "Riserva means a DOC or DOCG wine aged for at least a set number of months before release.", "x": 1},
{"c": 24, "q": "The base wine for most sparkling wines is typically:", "o": ["Dry, high in acidity and low in alcohol", "Low in acidity", "Full-bodied and oaked", "Sweet and high in alcohol"], "a": 0, "e": "The base wine is usually a blend of wines from different vintages, varieties and/or villages.", "x": 1},
{"c": 24, "q": "By roughly how much does the second fermentation raise the alcohol of a sparkling wine?", "o": ["Not at all", "About 10% abv", "About 5% abv", "About 1.5% abv"], "a": 3, "e": "Sugar and yeast are added to the base wine; the yeast make CO₂ and about 1.5% more alcohol.", "x": 1},
{"c": 24, "q": "In traditional-method sparkling wine, what is riddling?", "o": ["Slowly moving the bottle from horizontal to upside down so the lees slide into the neck", "Adding yeast and sugar to start the second fermentation", "Adding wine and sugar after disgorgement", "Removing the frozen plug of lees"], "a": 0, "e": "Riddling was traditionally by hand but is now mostly done by gyropalettes, which process hundreds of bottles at a time.", "x": 1},
{"c": 24, "q": "How is disgorgement carried out?", "o": ["The lees are left in the bottle", "The neck is frozen, and when the crown cap is removed, pressure forces out the plug of ice and lees", "The bottle is shaken until the lees dissolve", "The wine is filtered in a tank"], "a": 1, "e": "After riddling, the lees sit in the neck. Freezing traps them in ice, and the CO₂ pressure ejects the plug.", "x": 1},
{"c": 24, "q": "What is the liqueur d'expédition?", "o": ["Grape spirit used for fortification", "The yeast and sugar added for the second fermentation", "The frozen plug of lees", "A mixture of wine and, usually, sugar added at dosage"], "a": 3, "e": "After disgorgement, the bottle is topped up with the liqueur d'expédition. The dosage decides the final sweetness.", "x": 1},
{"c": 24, "q": "A sparkling wine labelled 'Demi-Sec' is:", "o": ["Medium in sweetness", "Fortified", "Bone dry with no sugar added", "Dry"], "a": 0, "e": "Brut has a very small amount of sugar but tastes dry thanks to high acidity and bubbles. Demi-Sec gets more sugar and tastes medium-sweet.", "x": 1},
{"c": 24, "q": "Which three grape varieties are typically blended for Champagne's base wine?", "o": ["Pinot Noir, Gamay and Chardonnay", "Glera, Chardonnay and Pinot Noir", "Chardonnay, Pinot Noir and Meunier", "Chardonnay, Sauvignon Blanc and Sémillon"], "a": 2, "e": "Champagne's cool climate gives base wines with low alcohol and high acidity.", "x": 1},
{"c": 24, "q": "What is the legal minimum time that Champagne must spend ageing on its lees?", "o": ["3 months", "12 months", "5 years", "There is no minimum"], "a": 1, "e": "The least expensive Champagnes spend the 12-month minimum and show light autolytic notes. Better ones age longer for toast and biscuit.", "x": 1},
{"c": 24, "q": "How do Vintage Champagnes differ from non-vintage?", "o": ["They're made by the tank method", "They're blends of several years", "They're cheaper", "Made only in exceptional years, aged long on the lees and in bottle, with nut and honey notes"], "a": 3, "e": "Vintage Champagne combines pronounced apple, citrus and autolytic notes with nuts and honey from bottle age.", "x": 1},

const KEY="wset-l2-drill-v1";
const L="abcd";
let S=null, home={sel:new Set(Object.keys(CH).map(Number)), shuffle:true, set:"all"};
const BANK=Q.filter(q=>!q.x).length, GAP=Q.length-BANK;
const inSet=i=>home.set==="all"||(home.set==="gap"?!!Q[i].x:!Q[i].x);
let H={}, armed=false;
let view="home", cloud=null, sync="checking", savedAt=0, writing=false;
function snapshot(){return {S,H,home:{sel:[...home.sel],shuffle:home.shuffle,set:home.set},t:savedAt}}
function mergeH(o){for(const k in (o||{})){const a=H[k],b=o[k];if(!a||(b.ts||0)>(a.ts||0))H[k]=b}}
function apply(d){d=JSON.parse(JSON.stringify(d));if(d.home){home.sel=new Set(d.home.sel);home.shuffle=!!d.home.shuffle;home.set=d.home.set||"all"}S=d.S||null;mergeH(d.H);savedAt=d.t||0}
function load(){try{const r=localStorage.getItem(KEY);if(r)apply(JSON.parse(r))}catch(e){}}
function save(){savedAt=Date.now();const b=snapshot();try{localStorage.setItem(KEY,JSON.stringify(b))}catch(e){}dirty=true;setSync(cloud?"saving":sync);clearTimeout(save.tm);save.tm=setTimeout(flush,500)}
let dirty=false, fails=0, lastCloud=0, dbRef=null, connecting=false;
async function flush(){
  if(writing||!dirty)return;
  if(!cloud){initCloud();return}
  writing=true;dirty=false;
  try{
    // pull first so answers made on another device are never overwritten
    try{const r=await cloud.get();if(r.exists){const d=r.data();mergeH(d.H)}}catch(e){}
    await cloud.set(snapshot());fails=0;lastCloud=Date.now();setSync("cloud")
  }catch(e){dirty=true;fails++;setSync("retry");setTimeout(flush,Math.min(30000,1500*2**fails)+Math.random()*1000)}
  writing=false;if(dirty&&!fails)flush()}
async function pull(){
  if(!cloud||writing)return;
  try{const r=await cloud.get();if(!r.exists)return;const d=r.data(),ct=d.t||0;
    if(ct>savedAt&&view==="home"&&!dirty){apply(d);try{localStorage.setItem(KEY,JSON.stringify(snapshot()))}catch(e){}renderHome()}
    else{const before=JSON.stringify(H);mergeH(d.H);if(JSON.stringify(H)!==before){dirty=true;flush();if(view==="home")renderHome()}}
  }catch(e){}}
function setSync(s){sync=s;const t=syncText();document.querySelectorAll(".syncline").forEach(el=>el.textContent=t)}
function ago(){const m=Math.round((Date.now()-lastCloud)/60000);return m<1?"just now":m+" min ago"}
function syncText(){return sync==="cloud"?"✓ Saved to your Claude account"+(lastCloud?" · "+ago():"")+". Picks up on any device.":sync==="saving"?"Saving…":sync==="retry"?"Saved on this device. Reconnecting to sync your account…":sync==="local"?"Saved on this device. Will sync to your account once it connects.":"Connecting to your account…"}
async function initCloud(){
  if(cloud||connecting)return;connecting=true;
  try{
    if(!window.claude||!window.claude.use)throw 0;
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user)throw 0;
    const id=await user.id();if(!id)throw 0;
    const ref=db.doc("data/users/"+id+"/progress");
    const snap=await ref.get();
    cloud=ref;lastCloud=Date.now();setSync("cloud");
    const d=snap.exists?snap.data():null, ct=d&&d.t||0;
    if(d&&ct>savedAt&&view==="home"){apply(d);try{localStorage.setItem(KEY,JSON.stringify(snapshot()))}catch(e){}renderHome()}
    else if(d){mergeH(d.H)}
    if(!d||savedAt>ct||dirty){dirty=true;flush()}
  }catch(e){setSync("local");setTimeout(()=>{connecting=false;initCloud()},10000+Math.random()*5000);return}
  connecting=false}
// save the moment the app is hidden or closed, and catch up when it comes back
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){clearTimeout(save.tm);flush()}else{flush();pull()}});
window.addEventListener("pagehide",()=>{clearTimeout(save.tm);flush()});
window.addEventListener("online",()=>{fails=0;flush();pull()});
setInterval(()=>{if(sync==="cloud")setSync("cloud")},30000);
function shuffled(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function start(ids){S={ids,queue:home.shuffle?shuffled(ids):ids.slice(),done:[],misses:{},cur:null,answered:false,picked:null};next()}
function next(){S.answered=false;S.picked=null;S.cur=S.queue.length?S.queue.shift():null;save();S.cur===null?renderDone():renderCard();window.scrollTo(0,0)}
function pick(i){if(S.answered)return;S.answered=true;S.picked=i;const q=Q[S.cur];const h=H[S.cur]||{n:0,w:0};h.n++;if(i!==q.a)h.w++;h.ok=i===q.a;h.ts=Date.now();H[S.cur]=h;if(i===q.a){S.done.push(S.cur)}else{S.misses[S.cur]=(S.misses[S.cur]||0)+1;S.queue.splice(Math.min(3,S.queue.length),0,S.cur)}save();renderCard()}

function renderHome(){
  view="home";
  const counts={};Q.forEach((q,i)=>{if(inSet(i))counts[q.c]=(counts[q.c]||0)+1});
  const n=Q.filter((q,i)=>inSet(i)&&home.sel.has(q.c)).length;
  const live=S&&S.cur!==null;
  const seen=Object.keys(H).length, solid=Object.values(H).filter(h=>h.ok).length, weak=Object.keys(H).map(Number).filter(k=>!H[k].ok||H[k].w>0).filter(k=>Q[k]&&inSet(k)&&home.sel.has(Q[k].c));
  const left=live?S.queue.filter((v,i,a)=>a.indexOf(v)===i&&!S.done.includes(v)).length+(S.done.includes(S.cur)?0:1):0;
  app.innerHTML=`<div class="wrap">
    <div class="eyebrow">Fine Vintage · Level 2 practice</div>
    <h1>WSET Level 2 Drills</h1>
    <p class="sub">Two question sets:</p>
    <ol class="sub" style="padding-left:20px;margin:6px 0 0"><li><b>Fine Vintage question bank</b>: all ${BANK} questions, replicated as written.</li><li><b>Additional generated questions (textbook based)</b>: ${GAP} questions written from the WSET textbook and workbook to cover everything the Fine Vintage bank leaves out, so together the two sets cover the whole textbook.</li></ol>
    <p class="sub">Miss one and it comes back a few cards later until you get it right.</p>
    <div class="sec"><div class="eyebrow">Question set</div></div>
    <div class="chips">${[["all","Both",Q.length],["bank","1. Fine Vintage question bank",BANK],["gap","2. Additional generated questions (textbook based)",GAP]].map(([k,v,c])=>`<button class="chip setb" data-s="${k}" aria-pressed="${home.set===k}"><span class="box">${home.set===k?"✓":""}</span><span class="nm">${v}</span><span class="ct">${c}</span></button>`).join("")}</div>
    <div class="stats"><div class="stat"><b>${n}</b><span>questions selected</span></div>${live?`<div class="stat"><b>${S.done.length}/${S.ids.length}</b><span>learned this session</span></div>`:""}</div>
    <div class="stats" style="margin-top:4px"><div class="stat"><b>${seen}/${Q.length}</b><span>answered at least once</span></div><div class="stat"><b>${solid}</b><span>right last time</span></div></div>
    ${weak.length?`<button class="btn ghost" id="weak" style="margin-top:8px">Drill my ${weak.length} trickiest</button>`:""}
    <p class="sub syncline" style="font-size:.85rem">${syncText()}</p>
    <div class="toggle"><div><b>Shuffle order</b><div class="sub" style="margin:0;font-size:.85rem">Off keeps the book order</div></div><button class="sw" id="shuf" role="switch" aria-checked="${home.shuffle}" aria-label="Shuffle order"></button></div>
    <div class="sec"><div class="eyebrow">Chapters</div><div><button class="link" id="all">All</button> · <button class="link" id="none">None</button></div></div>
    <div class="chips">${Object.entries(CH).map(([k,v])=>`<button class="chip" data-c="${k}" aria-pressed="${home.sel.has(+k)}"><span class="box">${home.sel.has(+k)?"✓":""}</span><span class="nm">${k}. ${esc(v)}</span><span class="ct">${counts[k]||0}</span></button>`).join("")}</div>
    ${S?`<div style="margin-top:18px"><button class="link" id="reset">Clear current session</button></div>`:""}${seen?`<div style="margin-top:6px"><button class="link" id="wipe">${armed==="wipe"?"Tap again to erase all history":"Reset all history"}</button></div>`:""}
  </div>
  <div class="dock"><div class="in">${live?`<button class="btn" id="resume">Resume (${left} left)</button><button class="btn ghost" id="go" ${n?"":"disabled"}>${armed?"Tap again to start over":"Start new"}</button>`:`<button class="btn" id="go" ${n?"":"disabled"}>Start ${n} questions</button>`}</div></div>`;
  app.querySelectorAll(".setb").forEach(b=>b.onclick=()=>{home.set=b.dataset.s;save();renderHome()});
  app.querySelectorAll(".chip:not(.setb)").forEach(b=>b.onclick=()=>{const c=+b.dataset.c;home.sel.has(c)?home.sel.delete(c):home.sel.add(c);save();renderHome()});
  app.querySelector("#all").onclick=()=>{home.sel=new Set(Object.keys(CH).map(Number));save();renderHome()};
  app.querySelector("#none").onclick=()=>{home.sel.clear();save();renderHome()};
  app.querySelector("#shuf").onclick=()=>{home.shuffle=!home.shuffle;save();renderHome()};
  app.querySelector("#go").onclick=()=>{if(live&&!armed){armed=true;renderHome();setTimeout(()=>{if(armed){armed=false;if(view==="home")renderHome()}},4000);return}armed=false;start(Q.map((q,i)=>i).filter(i=>inSet(i)&&home.sel.has(Q[i].c)))};
  const wk=app.querySelector("#weak");if(wk)wk.onclick=()=>{if(live&&!armed){armed=true;wk.textContent="Tap again: replaces your current session";return}armed=false;start(weak)};
  const r=app.querySelector("#resume");if(r)r.onclick=()=>renderCard();
  const x=app.querySelector("#reset");if(x)x.onclick=()=>{S=null;save();renderHome()};
  const w=app.querySelector("#wipe");if(w)w.onclick=()=>{if(armed!=="wipe"){armed="wipe";renderHome();return}armed=false;H={};S=null;save();renderHome()};
}

function renderCard(){
  view="renderCard";
  const q=Q[S.cur],tot=S.ids.length,done=S.done.length,retry=S.misses[S.cur];
  const pct=Math.round(done/tot*100);
  const ok=S.answered&&S.picked===q.a;
  app.innerHTML=`<div class="wrap" style="padding-top:4px">
    <div class="top"><button class="back" id="back" aria-label="Back to chapters">←</button>
      <div class="prog"><div class="bar"><i style="width:${pct}%"></i></div><div class="meta"><span>${done} of ${tot} learned</span><span>${Object.keys(S.misses).length} missed so far</span></div></div></div>
    <div class="card">
      <div class="tags"><span class="eyebrow">${q.x?`A${S.cur+1-BANK}`:`Q${S.cur+1}`} · ${esc(CH[q.c])}</span>${q.x?`<span class="tag">Additional generated questions (textbook based)</span>`:""}${retry&&!(S.answered&&!ok&&retry===1)?`<span class="tag">Retry</span>`:""}</div>
      <h2 class="q">${esc(q.q)}</h2>
      ${q.h?`<p class="sub" style="margin-top:8px;font-size:.85rem;font-weight:600">${q.h.map(esc).join(" · ")}</p>`:""}
      ${q.s?`<ol class="stmts">${q.s.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`:""}
      <div class="opts">${q.o.map((o,i)=>{let c="";if(S.answered){if(i===q.a)c="right";else if(i===S.picked)c="wrong";else c="dim"}return `<button class="opt ${c}" data-i="${i}" ${S.answered?"disabled":""}><span class="l">${L[i]}</span><span class="t">${esc(o)}${S.answered?`<span class="why">${i===q.a?"Correct answer":esc((N[S.cur]||[])[i]||"")}</span>`:""}</span></button>`}).join("")}</div>
      ${S.answered?`<div class="fb ${ok?"ok":"no"}" role="status"><h3>${ok?"Correct":"Not quite"}</h3>${ok?"":`<p class="ans">Answer: ${L[q.a]}) ${esc(q.o[q.a])}</p>`}<p>${esc(q.e)}</p>${M[S.cur]?`<p class="mem"><span class="lb">Remember it</span>${esc(M[S.cur])}</p>`:""}${ok?"":`<p class="later">This one will come back in a few cards.</p>`}</div>`:""}
      <p class="sub syncline" style="font-size:.78rem;margin-top:14px">${syncText()}</p>
      <p class="kbd">Keys: a–d or 1–4 to answer, Enter for next.</p>
    </div></div>
    ${S.answered?`<div class="dock"><div class="in"><button class="btn" id="next">${S.queue.length?"Next question":"See results"}</button></div></div>`:""}`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  app.querySelector("#back").onclick=renderHome;
  const n=app.querySelector("#next");if(n){n.onclick=next;n.focus({preventScroll:true})}
}

function renderDone(){
  view="renderDone";
  const m=Object.entries(S.misses).sort((a,b)=>b[1]-a[1]);
  const first=S.ids.length-m.length;
  app.innerHTML=`<div class="wrap">
    <div class="eyebrow">Session complete</div>
    <h1>All ${S.ids.length} learned</h1>
    <div class="stats"><div class="stat"><b>${first}</b><span>right first time</span></div><div class="stat"><b>${m.length}</b><span>needed a retry</span></div><div class="stat"><b>${Math.round(first/S.ids.length*100)}%</b><span>first-try score</span></div></div>
    ${m.length?`<div class="sec"><div class="eyebrow">Your trickiest questions</div></div><div class="miss">${m.map(([i,c])=>{const q=Q[i];return `<div class="mi"><div class="n">${q.x?`A${+i+1-BANK}`:`Q${+i+1}`} · missed ${c}×</div><div>${esc(q.q)}</div><div class="a">${L[q.a]}) ${esc(q.o[q.a])}</div></div>`}).join("")}</div>`:`<p class="sub">Clean sweep. Nice work.</p>`}
  </div>
  <div class="dock"><div class="in"><button class="btn ghost" id="home">Chapters</button>${m.length?`<button class="btn" id="drill">Drill these ${m.length}</button>`:""}</div></div>`;
  app.querySelector("#home").onclick=()=>{S=null;save();renderHome()};
  const d=app.querySelector("#drill");if(d)d.onclick=()=>start(m.map(([i])=>+i));
}

document.addEventListener("keydown",e=>{
  if(!S||S.cur===null||!app.querySelector(".card"))return;
  const k=e.key.toLowerCase();
  if(!S.answered){let i="abcd".indexOf(k);if(i<0)i="1234".indexOf(k);if(i>=0&&i<Q[S.cur].o.length)pick(i)}
  else if(k==="enter"){e.preventDefault();next()}
});
load();renderHome();initCloud();
</script>

</body></html>
